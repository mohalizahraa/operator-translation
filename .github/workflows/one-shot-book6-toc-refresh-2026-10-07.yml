name: One-shot Book 6 TOC Refresh 2026-10-07

on:
  push:
    paths:
      - '.github/workflows/one-shot-book6-toc-refresh-2026-10-07.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/1DmCHtfaYsWwWKavXipTrWZo9oq0E4tq2FZVySoSa18A/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral Firefox driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install firefox
      - name: Refresh native Google Docs TOC after final formatting
        shell: bash
        run: |
          cat > ./refresh-book6-toc.mjs <<'NODE'
          import { firefox } from "playwright";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await firefox.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:"en-US"});
          const page=await context.newPage();

          async function focusEditor(){
            for(const loc of [
              page.locator(".kix-appview-editor").first(),
              page.locator(".kix-page-paginated").first(),
              page.locator('[role="textbox"]').first()
            ]){
              if(await loc.isVisible({timeout:1600}).catch(()=>false)){
                await loc.click({position:{x:520,y:220},force:true}).catch(()=>{});
                return;
              }
            }
            await page.mouse.click(800,450);
          }
          async function findAndSettle(query,settle=2000){
            await focusEditor();
            await page.keyboard.press("Meta+f");
            await sleep(300);
            await page.keyboard.type(query,{delay:18});
            await sleep(900);
            const close=page.getByLabel("Close",{exact:true}).first();
            if(await close.isVisible({timeout:1200}).catch(()=>false)) await close.click({force:true});
            else await page.keyboard.press("Escape");
            await sleep(settle);
          }
          async function clickRefresh(){
            const shell=page.getByLabel("Table of contents",{exact:true}).last();
            if(await shell.count().catch(()=>0)){
              try{
                await shell.scrollIntoViewIfNeeded().catch(()=>{});
                await shell.click({force:true});
                await sleep(600);
                const exact=page.getByLabel("Update table of contents",{exact:true}).last();
                if(await exact.isVisible({timeout:1500}).catch(()=>false)){
                  await exact.click({force:true});
                  return true;
                }
              }catch{}
            }
            const candidates=[
              page.getByLabel(/(?:Refresh|Update) table of contents/i).last(),
              page.getByLabel(/^(?:Refresh|Update)$/i).last(),
              page.locator('[aria-label*="Refresh" i][aria-label*="table" i]').last(),
              page.locator('[aria-label*="Update" i][aria-label*="table" i]').last(),
              page.locator('[data-tooltip*="Refresh" i][data-tooltip*="table" i]').last(),
              page.locator('[data-tooltip*="Update" i][data-tooltip*="table" i]').last()
            ];
            for(const loc of candidates){
              if(await loc.isVisible({timeout:500}).catch(()=>false)){
                await loc.click({force:true});
                return true;
              }
            }
            return false;
          }

          try{
            await page.goto(process.env.DOC_URL,{waitUntil:"domcontentloaded",timeout:120000});
            await sleep(12000);
            if(/accounts\.google\.com/.test(page.url())) throw new Error("Document requires sign-in");

            for(const anchor of [
              "Preface",
              "Preliminary Studies",
              "The First Quality",
              "The Seventh Attribute",
              "The Thirteenth Attribute",
              "Sources"
            ]) await findAndSettle(anchor,1800);

            await findAndSettle("Contents",1800);

            const directTargets=[
              page.getByRole('link',{name:/^Contents/i}).first(),
              page.locator('[aria-label^="Contents" i]').first(),
              page.getByText(/^Contents(?:\s+\d+)?$/i).first(),
              page.locator('.kix-lineview-content').filter({hasText:/Contents/i}).first()
            ];
            for(const target of directTargets){
              if(await target.isVisible({timeout:700}).catch(()=>false)){
                await target.click({force:true}).catch(()=>{});
                await sleep(700);
                if(await clickRefresh()){
                  console.log("NATIVE_TOC_REFRESH_COMPLETED_DIRECT");
                  await sleep(9000);
                  process.exit(0);
                }
              }
            }

            for(const key of ["ArrowRight","End","ArrowDown","ArrowDown"]){
              await page.keyboard.press(key).catch(()=>{});
              await sleep(400);
              if(await clickRefresh()){
                console.log("NATIVE_TOC_REFRESH_COMPLETED_KEYBOARD");
                await sleep(9000);
                process.exit(0);
              }
            }
            throw new Error("Native TOC refresh control not found");
          } finally {
            await browser.close();
          }
          NODE
          node ./refresh-book6-toc.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./refresh-book6-toc.mjs
          rm -rf /tmp/operator-playwright-firefox
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

name: One-shot Intercession Progress 96

on:
  push:
    paths:
      - '.github/workflows/one-shot-intercession-progress-96.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 96/375 translation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          progress=$(cat <<'JSON'
          {
            "translated_pages": 96,
            "expected_previous_pages": 91,
            "source_total_pages": 375,
            "source_pdf_sha256": "48d338363f4443d291c4e53365efef6eb36deb87ddfe788bb1e8559cd1c58cbf",
            "google_doc_revision": "AHj4eMQMyNudnXRneawWFbLbD2IQbP4Ay8l4wCR9zqmNrLpUay_1eqPPoxgFwf7TEA6Lsl8a6-F_K_qX7TrqkwyOvk81Z6x9vLFwXCc3iXs",
            "verification_note": "Verified continuous Arabic-source-to-English translation through physical source page 96 of 375. Pages 92-96 complete the remaining reports permitting grave visitation after the earlier prohibition, add the Ahl al-Bayt narrations on grave visitation, and begin the scholars' statements through al-Albani's seventh statement. The seventh statement continues onto source page 97 and was translated to close page 96 cleanly, but page 97 is not yet credited. All 24 new source notes are native Google Docs footnotes; the manuscript now contains 194 native footnotes total. No residual source-footnote placeholders remain. Continue sequentially with the uncredited remainder of physical source page 97."
          }
          JSON
          )
          curl -fsS -X PATCH             -H 'content-type: application/json'             -H 'x-workbench-actor: Zahraa'             --data "$progress"             https://haydari-translation-workbench.pages.dev/api/projects/5/progress
          printf '\n'
          project=$(cat <<'JSON'
          {
            "status": "in_progress",
            "notes": "Translation active. Verified physical source-page checkpoint: 96/375. Pages 92-96 are source-verified in the live English Doc; 24 new native footnotes were added, 194 native footnotes total. Page 97 is partially translated only to complete a paragraph begun on page 96 and is not yet credited. Continue sequentially from the remaining content on physical source page 97."
          }
          JSON
          )
          curl -fsS -X PATCH             -H 'content-type: application/json'             -H 'x-workbench-actor: Zahraa'             --data "$project"             https://haydari-translation-workbench.pages.dev/api/projects/5
          printf '\n'
      - name: Verify live Workbench readback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --connect-timeout 20             https://haydari-translation-workbench.pages.dev/api/projects -o /tmp/projects.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/projects.json'))
          p=next((x for x in data.get('projects',[]) if int(x.get('id') or 0)==5),None)
          if not p: raise SystemExit('INTERCESSION_PROJECT_NOT_FOUND')
          if int(p.get('translated_pages') or 0)!=96:
              raise SystemExit(f"INTERCESSION_PROGRESS_VERIFY_FAILED got={p.get('translated_pages')}")
          if p.get('status')!='in_progress':
              raise SystemExit(f"INTERCESSION_STATUS_VERIFY_FAILED got={p.get('status')}")
          print('INTERCESSION_PROGRESS_96_VERIFIED')
          PY

name: One-shot Book 6 Native Structure

on:
  push:
    paths:
      - '.github/workflows/one-shot-book6-native-structure.yml'

permissions:
  contents: read

jobs:
  native-structure:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 20
    env:
      DOC_URL: https://docs.google.com/document/d/1DmCHtfaYsWwWKavXipTrWZo9oq0E4tq2FZVySoSa18A/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral Firefox driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install firefox
      - name: Insert native page numbers and native table of contents
        shell: bash
        run: |
          cat > ./book6-native-structure.mjs <<'NODE'
          import { firefox } from "playwright";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await firefox.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:"en-US"});
          const page=await context.newPage();

          async function clickIfVisible(loc,timeout=1200){
            try{if(await loc.isVisible({timeout})){await loc.click({force:true});return true}}catch{}
            return false;
          }
          async function dismiss(){
            for(const label of ["Got it","No thanks","Dismiss","Close"]){
              await clickIfVisible(page.getByRole("button",{name:label,exact:true}));
            }
          }
          async function focusEditor(){
            await dismiss();
            for(const loc of [
              page.locator(".kix-appview-editor").first(),
              page.locator(".kix-page-paginated").first(),
              page.locator('[role="textbox"]').first()
            ]){
              if(await loc.isVisible({timeout:1800}).catch(()=>false)){
                await loc.click({position:{x:520,y:220},force:true}).catch(()=>{});
                return;
              }
            }
            await page.mouse.click(800,450);
          }
          async function findInDoc(q,settle=1500){
            await focusEditor();
            await page.keyboard.press("Meta+f");
            await sleep(300);
            await page.keyboard.type(q,{delay:20});
            await sleep(1000);
            const close=page.getByLabel("Close",{exact:true}).first();
            if(await close.isVisible({timeout:1200}).catch(()=>false)) await close.click({force:true});
            else await page.keyboard.press("Escape");
            await sleep(settle);
          }
          async function openInsert(){
            await dismiss();
            const m=page.locator("#docs-insert-menu");
            if(await m.isVisible({timeout:2500}).catch(()=>false)){await m.click({force:true});return;}
            const t=page.getByText("Insert",{exact:true}).first();
            if(!(await t.isVisible({timeout:2500}).catch(()=>false))) throw new Error("Insert menu unavailable");
            await t.click({force:true});
          }
          async function insertPageNumbers(){
            await focusEditor();
            await openInsert(); await sleep(500);
            const pe=page.getByText("Page elements",{exact:true}).last();
            if(await pe.isVisible({timeout:1200}).catch(()=>false)){await pe.hover();await sleep(500);}
            let pn=page.getByText("Page number",{exact:true}).last();
            if(!(await pn.isVisible({timeout:1400}).catch(()=>false))) pn=page.getByText(/Page number/i).last();
            if(!(await pn.isVisible({timeout:1800}).catch(()=>false))) throw new Error("Page number menu unavailable");
            await pn.hover(); await sleep(750);

            const strong=[
              page.getByLabel(/page number.*header.*(?:first|every|all)/i).last(),
              page.getByLabel(/header.*page number.*(?:first|every|all)/i).last(),
              page.locator('[aria-label*="page number" i][aria-label*="header" i]').filter({hasNotText:/second|skip/i}).first()
            ];
            for(const loc of strong){
              if(await loc.isVisible({timeout:700}).catch(()=>false)){
                await loc.click({force:true}); console.log("PAGE_NUMBERS_INSERTED"); await sleep(5000); return;
              }
            }
            const nodes=page.locator('[role="menuitem"]:visible,[role="button"]:visible,[tabindex="0"]:visible');
            const n=await nodes.count(), candidates=[];
            for(let i=0;i<n;i++){
              const node=nodes.nth(i);
              const all=((await node.getAttribute("aria-label"))||"")+" "+((await node.getAttribute("title"))||"")+" "+(((await node.textContent())||"").trim());
              if(/page number/i.test(all)&&!/^\s*page number\s*$/i.test(all)&&!/more options|page count/i.test(all)) candidates.push({i,all});
            }
            if(!candidates.length) throw new Error("Page number preset unavailable");
            const chosen=candidates.find(x=>/header|top/i.test(x.all)&&!/skip|second page|start.*2/i.test(x.all))||candidates[0];
            await nodes.nth(chosen.i).click({force:true});
            console.log("PAGE_NUMBERS_INSERTED_FALLBACK="+chosen.all);
            await sleep(5000);
          }
          async function insertToc(){
            await findInDoc("Contents",1800);
            await page.keyboard.press("ArrowRight");
            await page.keyboard.press("End");
            await page.keyboard.press("Enter");
            await sleep(500);
            await openInsert(); await sleep(500);
            const pe=page.getByText("Page elements",{exact:true}).last();
            if(await pe.isVisible({timeout:1300}).catch(()=>false)){await pe.hover();await sleep(450);}
            let toc=page.getByText("Table of contents",{exact:true}).last();
            if(!(await toc.isVisible({timeout:1500}).catch(()=>false))) toc=page.getByText(/Table of contents/i).last();
            if(!(await toc.isVisible({timeout:1800}).catch(()=>false))) throw new Error("TOC menu unavailable");
            await toc.hover(); await sleep(700);

            for(const pattern of [/dotted/i,/dots/i,/page numbers/i,/numbers/i]){
              const l=page.getByLabel(pattern).last();
              if(await l.isVisible({timeout:650}).catch(()=>false)){
                await l.click({force:true}); console.log("TOC_INSERTED"); await sleep(9000); return;
              }
              const x=page.getByText(pattern).last();
              if(await x.isVisible({timeout:650}).catch(()=>false)){
                await x.click({force:true}); console.log("TOC_INSERTED_TEXT"); await sleep(9000); return;
              }
            }
            const nodes=page.locator('[role="menuitem"]:visible,[role="button"]:visible,[tabindex="0"]:visible');
            const n=await nodes.count(), c=[];
            for(let i=0;i<n;i++){
              const node=nodes.nth(i);
              const all=((await node.getAttribute("aria-label"))||"")+" "+((await node.getAttribute("title"))||"");
              if(/table of contents|page number|dot/i.test(all)) c.push(i);
            }
            if(!c.length) throw new Error("TOC style preset unavailable");
            await nodes.nth(c[Math.min(1,c.length-1)]).click({force:true});
            console.log("TOC_INSERTED_FALLBACK"); await sleep(9000);
          }

          try{
            await page.goto(process.env.DOC_URL,{waitUntil:"domcontentloaded",timeout:120000});
            await sleep(12000);
            if(/accounts\.google\.com/.test(page.url())) throw new Error("Document requires sign-in");
            await insertPageNumbers();
            await insertToc();
            console.log("BOOK6_NATIVE_STRUCTURE_COMPLETE");
          } finally { await browser.close(); }
          NODE
          node ./book6-native-structure.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./book6-native-structure.mjs
          rm -rf /tmp/operator-playwright-firefox
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

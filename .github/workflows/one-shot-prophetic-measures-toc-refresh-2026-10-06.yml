name: One-shot Prophetic Measures TOC Refresh 2026-10-06

on:
  push:
    paths:
      - '.github/workflows/one-shot-prophetic-measures-toc-refresh-2026-10-06.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/1C8ZOE14w9mUF27hBowwnk42d_fG2cl32R2T5GAeepS8/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral browser driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Refresh native Google Docs TOC
        shell: bash
        run: |
          cat > ./refresh-prophetic-measures-toc.mjs <<'NODE'
          import { chromium } from "playwright";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function clickIfVisible(locator, timeout = 1200) {
            try {
              if (await locator.isVisible({ timeout })) {
                await locator.click({ force: true });
                return true;
              }
            } catch {}
            return false;
          }

          async function focusEditor(page) {
            for (const label of ["Got it", "No thanks", "Dismiss", "Close"]) {
              await clickIfVisible(page.getByRole("button", { name: label, exact: true }));
            }
            for (const loc of [
              page.locator(".kix-appview-editor"),
              page.locator(".kix-page-paginated"),
              page.locator('[role="textbox"]'),
            ]) {
              try {
                if (await loc.first().isVisible({ timeout: 2500 })) {
                  await loc.first().click({ position: { x: 520, y: 220 }, force: true });
                  return;
                }
              } catch {}
            }
            await page.mouse.click(800, 450);
          }

          async function findInDocument(page, query, settle = 900) {
            await focusEditor(page);
            await page.keyboard.press("Meta+f");
            await sleep(300);
            await page.keyboard.type(query, { delay: 18 });
            await sleep(700);
            const closeFind = page.getByLabel("Close", { exact: true }).first();
            if (await closeFind.isVisible({ timeout: 1200 }).catch(() => false)) {
              await closeFind.click();
            } else {
              await page.keyboard.press("Escape");
            }
            await sleep(settle);
          }

          async function clickRefresh(page) {
            const selectors = [
              page.getByLabel(/(?:Refresh|Update) table of contents/i).last(),
              page.getByLabel(/^(?:Refresh|Update)$/i).last(),
              page.locator('[aria-label*="Refresh" i][aria-label*="table" i]').last(),
              page.locator('[aria-label*="Update" i][aria-label*="table" i]').last(),
              page.locator('[data-tooltip*="Refresh" i][data-tooltip*="table" i]').last(),
              page.locator('[data-tooltip*="Update" i][data-tooltip*="table" i]').last(),
              page.locator('[title*="Refresh" i][title*="table" i]').last(),
              page.locator('[title*="Update" i][title*="table" i]').last(),
            ];
            for (const loc of selectors) {
              if (await loc.isVisible({ timeout: 1200 }).catch(() => false)) {
                await loc.click({ force: true });
                return true;
              }
            }
            return false;
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            locale: "en-US",
          });
          const page = await context.newPage();

          try {
            await page.goto(process.env.DOC_URL, { waitUntil: "domcontentloaded", timeout: 120000 });
            await sleep(10000);
            if (/accounts\.google\.com/.test(page.url())) {
              throw new Error("Document unexpectedly requires sign-in");
            }

            // Touch distributed anchors so Google Docs settles whole-book pagination first.
            for (const anchor of [
              "Introduction",
              "Chapter One",
              "Chapter Three",
              "Chapter Five",
              "Chapter Seven",
              "Chapter Nine",
              "Chapter Ten",
              "Sources and References",
            ]) {
              console.log("PAGINATE_ANCHOR=" + anchor);
              await findInDocument(page, anchor, 1800);
            }

            // The first Introduction match is inside the TOC because the TOC precedes body headings.
            await findInDocument(page, "Introduction", 1200);
            await page.keyboard.press("ArrowRight");
            await sleep(700);

            if (!(await clickRefresh(page))) {
              const tocShell = page.getByLabel("Table of contents", { exact: true }).last();
              if (await tocShell.isVisible({ timeout: 1500 }).catch(() => false)) {
                await tocShell.click({ force: true });
                await sleep(600);
              }
              if (!(await clickRefresh(page))) {
                throw new Error("Could not find native Google Docs TOC refresh control");
              }
            }

            await sleep(9000);
            console.log("NATIVE_TOC_REFRESH_COMPLETED");
          } finally {
            await browser.close();
          }
          NODE
          node ./refresh-prophetic-measures-toc.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./refresh-prophetic-measures-toc.mjs
          rm -rf /tmp/operator-playwright-browsers
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

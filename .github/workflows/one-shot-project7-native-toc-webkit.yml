name: One-shot Project 7 Native TOC WebKit
# terminal native-TOC refresh after heading, honorific, footnote, and translation review
# registered terminal refresh trigger 2026-10-06

on:
  push:
    paths:
      - '.github/workflows/one-shot-project7-native-toc-webkit.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/1fOo0Y8M1UcaKHR-odP87jGRRlCAT3x9i6AVX7qi6lB0/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral WebKit driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - name: Refresh native Google Docs TOC after whole-book pagination
        shell: bash
        run: |
          cat > ./refresh-project7-toc.mjs <<'NODE'
          import { webkit } from "playwright";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:"en-US"});
          const page=await context.newPage();

          async function clickRefresh(){
            const shell=page.getByLabel("Table of contents",{exact:true}).last();
            if(await shell.count().catch(()=>0)){
              try{
                await shell.scrollIntoViewIfNeeded().catch(()=>{});
                await shell.click({force:true});
                await sleep(600);
                const exact=page.getByLabel("Update table of contents",{exact:true}).last();
                if(await exact.isVisible({timeout:1500}).catch(()=>false)){
                  await exact.click({force:true});
                  console.log("TOC_REFRESH_VISIBLE_CLICK");
                  return true;
                }
              }catch{}
            }
            const candidates=[
              page.getByLabel(/(?:Refresh|Update) table of contents/i).last(),
              page.getByLabel(/^(?:Refresh|Update)$/i).last(),
              page.locator('[aria-label*="Refresh" i][aria-label*="table" i]').last(),
              page.locator('[aria-label*="Update" i][aria-label*="table" i]').last(),
              page.locator('[data-tooltip*="Refresh" i][data-tooltip*="table" i]').last(),
              page.locator('[data-tooltip*="Update" i][data-tooltip*="table" i]').last(),
              page.locator('[title*="Refresh" i][title*="table" i]').last(),
              page.locator('[title*="Update" i][title*="table" i]').last()
            ];
            for(const loc of candidates){
              if(await loc.isVisible({timeout:500}).catch(()=>false)){
                await loc.click({force:true});
                return true;
              }
            }
            return false;
          }

          async function focusEditor(){
            for(const loc of [
              page.locator(".kix-appview-editor").first(),
              page.locator(".kix-page-paginated").first(),
              page.locator('[role="textbox"]').first()
            ]){
              if(await loc.isVisible({timeout:1600}).catch(()=>false)){
                await loc.click({position:{x:520,y:220},force:true}).catch(()=>{});
                return;
              }
            }
            await page.mouse.click(800,450);
          }

          async function findAndSettle(query, settle=2200){
            await focusEditor();
            await page.keyboard.press("Meta+f");
            await sleep(300);
            await page.keyboard.type(query,{delay:18});
            await sleep(900);
            const close=page.getByLabel("Close",{exact:true}).first();
            if(await close.isVisible({timeout:1200}).catch(()=>false)) await close.click();
            else await page.keyboard.press("Escape");
            await sleep(settle);
          }

          try{
            await page.goto(process.env.DOC_URL,{waitUntil:"domcontentloaded",timeout:120000});
            await sleep(12000);
            if(/accounts\.google\.com/.test(page.url())) throw new Error("Document requires sign-in");

            const anchors=[
              "Islamic Jurisprudence and the Necessity of Ijtihād",
              "Causes of the Problem in Contemporary Islamic Jurisprudence",
              "Jurisprudential Theories in the Imāmī School",
              "Imam Khomeini and the Theory of Time and Place",
              "Indexes",
              "Index of References and Sources"
            ];
            for(const anchor of anchors){
              console.log("PAGINATE_ANCHOR="+anchor);
              await findAndSettle(anchor,2200);
            }

            await findAndSettle("Contents",1800);

            const directTargets=[
              page.getByRole('link',{name:/^Islamic Jurisprudence and the Necessity of Ijtihād/i}).first(),
              page.locator('[aria-label^="Islamic Jurisprudence and the Necessity of Ijtihād" i]').first(),
              page.locator('[aria-label*="Islamic Jurisprudence and the Necessity of Ijtihād" i]').first(),
              page.getByText(/^Islamic Jurisprudence and the Necessity of Ijtihād(?:\\s+\\d+)?$/i).first(),
              page.locator('.kix-lineview-content').filter({hasText:/Islamic Jurisprudence and the Necessity of Ijtihād/i}).first()
            ];
            for(const target of directTargets){
              if(await target.isVisible({timeout:700}).catch(()=>false)){
                await target.click({force:true}).catch(()=>{});
                await sleep(700);
                if(await clickRefresh()){
                  console.log("PROJECT7_TOC_REFRESH_COMPLETED_DIRECT");
                  await sleep(9000);
                  process.exit(0);
                }
              }
            }

            for(const key of ["ArrowRight","End","ArrowDown","ArrowDown"]){
              await page.keyboard.press(key).catch(()=>{});
              await sleep(400);
              if(await clickRefresh()){
                console.log("PROJECT7_TOC_REFRESH_COMPLETED_KEYBOARD");
                await sleep(9000);
                process.exit(0);
              }
            }

            const pages=page.locator(".kix-page-paginated:visible");
            const count=await pages.count();
            console.log("VISIBLE_PAGE_COUNT="+count);
            let clicked=false;
            for(let i=0;i<count && !clicked;i++){
              const b=await pages.nth(i).boundingBox().catch(()=>null);
              if(!b) continue;
              const points=[
                [0.20,0.10],[0.50,0.10],[0.80,0.10],
                [0.20,0.18],[0.50,0.18],[0.80,0.18],
                [0.20,0.28],[0.50,0.28],[0.80,0.28],
                [0.20,0.40],[0.50,0.40],[0.80,0.40],
                [0.20,0.55],[0.50,0.55],[0.80,0.55],
                [0.20,0.70],[0.50,0.70],[0.80,0.70]
              ];
              for(const [xr,yr] of points){
                await page.mouse.click(b.x+b.width*xr,b.y+b.height*yr);
                await sleep(350);
                if(await clickRefresh()){clicked=true;break;}
              }
            }
            if(!clicked) throw new Error("Native TOC refresh control not found after whole-book pagination pass");
            await sleep(9000);
            console.log("PROJECT7_TOC_REFRESH_COMPLETED");
          }finally{
            await browser.close();
          }
          NODE
          node ./refresh-project7-toc.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./refresh-project7-toc.mjs
          rm -rf /tmp/operator-playwright-webkit
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

# fixed-point-refresh-2

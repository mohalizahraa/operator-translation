name: Workbench English Docs Public Access Capability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-workbench-public-doc-access-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 6
    steps:
      - name: Check available authenticated Drive paths without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in gcloud rclone oauth2l gdrive safaridriver osascript; do
            if command -v "$name" >/dev/null; then echo "BIN_${name}=present"; else echo "BIN_${name}=absent"; fi
          done
          for path in "$HOME/.config/gcloud/application_default_credentials.json" "$HOME/.config/rclone/rclone.conf" "$HOME/.config/gdrive3/token_v2.json" "$HOME/.credentials" "$HOME/.config/gdrive"; do
            name="$(basename "$path")"
            if [ -e "$path" ]; then echo "CREDENTIAL_PATH_${name}=present"; else echo "CREDENTIAL_PATH_${name}=absent"; fi
          done
          python3 - <<'PY'
          import importlib.util
          for module in ["google.auth","googleapiclient","pydrive2","selenium","playwright"]:
              try:
                  present = importlib.util.find_spec(module) is not None
              except (ImportError,ValueError,ModuleNotFoundError):
                  present = False
              print("PYMODULE_"+module.replace(".","_")+"="+("present" if present else "absent"))
          PY
          if command -v rclone >/dev/null; then
            echo "RCLONE_REMOTE_TYPES_BEGIN"
            rclone listremotes 2>/dev/null | sed -E 's/[^A-Za-z0-9_-]/_/g' | head -15 || true
            echo "RCLONE_REMOTE_TYPES_END"
          fi
          if command -v osascript >/dev/null; then
            osascript -e 'tell application "System Events" to return "AppleScript ready"' 2>/dev/null || echo "APPLESCRIPT_GUI_UNAVAILABLE"
          fi
          echo "NO_AUTH_TOKENS_OR_USER_FILES_PRINTED"

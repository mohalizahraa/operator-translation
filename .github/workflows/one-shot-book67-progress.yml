name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 16/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 16,
            "expected_previous_pages": 15,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQkDs3YjS1Y9LcLA24jOZnANJIeED6q-FbASN8xAItxWQmQ0__AY7uue6xFCVMXRVeDekVUYgfQC5zs1WjgKJlJI3wrTWwmGhN6-C28",
            "verification_note": "Physical source page 16 was visually rendered from the authoritative 584-page PDF on the self-hosted macOS/ARM64 runner and confirmed intentionally blank. No target mutation was required, so the same verified Google Doc revision remains current."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

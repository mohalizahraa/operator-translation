name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 54/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 54,
            "expected_previous_pages": 32,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQkxL_l2oz4COnqs8Z8LRLgfNd2RRb1VZ3R7219pQOg-nefDlIOQMkYjnwBn59TIM45bnUu671S8Lgky04M-2pOueZqvR5oZq8TCQZM",
            "verification_note": "Verified source coverage through physical page 54 against the authoritative PDF hash. Pages 33-53 were translated into the live English Doc and physical page 54 was visually rendered and confirmed blank. This tranche added 31 populated native Google Docs footnotes at source-relative anchors; whole-doc native-footnote count is 48 with 0 empty notes. New body and notes have 0 unapproved Arabic-script hits. A fresh 41-page target PDF render verified representative long footnote continuations and the Chapter Two opener without an accidental interstitial page."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

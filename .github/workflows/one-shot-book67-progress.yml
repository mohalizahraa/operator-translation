name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 205/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 205,
            "expected_previous_pages": 140,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQmAAvQjKLzOj9QzxDVMarGe4JugLU7x-ebuk64h3nKxdupkxyIeEpXQbVeCMaCKIJLTPCRojP3zMQNHeEEhp_dVvs9l2hUAVQgne74",
            "verification_note": "Verified continuous English body coverage through physical source page 205 in the live Google Doc. The translated run now includes the remaining Prophetic measures, the supporting Companion descriptions, and closes the section with Imam Ali's lament for Ammar, Ibn al-Tayyihan, Dhu al-Shahadatayn, and their peers. Source-note translations for later pages are separately staged through page 220 and are not counted as body-page completion. Native-footnote migration and final formatting/publication QA remain open."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

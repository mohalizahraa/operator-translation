name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 239/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 239,
            "expected_previous_pages": 239,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQkAqbTM00cCsrzS5eRJG2up6_0Mi1Dewk7mto7kbju5M_7EhQitcrg166f4gfVG1cDe8T6D6tQzK_N8wKMCOYCKUXKwk9_7uu61NTA",
            "verification_note": "Verified continuous English body coverage through physical source page 239 in the live Google Doc. Pages 206 and 208 are blank source pages; the previously missing 207-220 body gap is now filled, reconnecting the already translated 221-239 material into one continuous run. Source-note translations are staged through page 239 pending native Google Docs footnote migration. Final formatting/publication QA remains open."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

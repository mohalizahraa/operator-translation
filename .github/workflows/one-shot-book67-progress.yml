name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 280/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 280,
            "expected_previous_pages": 259,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQmd0wSpzuftxDgutRnCtK6kHUmDtTsQbGqvBBFGYUTg01BxRF1y2kYwW2gbno6tqhDJjBSenNg95VWqXFOD_FlIUocp4O_-neOuRtM",
            "verification_note": "Verified continuous English translation coverage through physical source page 280 in the live Google Doc. Chapter Five now extends through Fatimah's future-facing warning about the Saqifah and into her three measures for invalidating the government of the reversal. Source-note text remains preserved in explicit staging markers pending native-footnote migration and final formatting/publication QA."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

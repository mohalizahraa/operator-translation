name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 490/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 490,
            "expected_previous_pages": 480,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQlzsLvmETeAAfg_GAMRhqydy-NU2OeheJqoJx3aVNNYZyUCtGPFFhoRIhDc0I4IgItZa1vQXvIL8ZxLylYs-hxMUpoWrmV9eIn99z4",
            "verification_note": "Verified continuous English translation coverage through physical source page 490 in the live Google Doc. Pages 481-490 were translated from the authoritative Book 67 OCR/source artifact and read back successfully, including headings, Qur'anic and hadith material, poetry, and source-note staging text. Translation remains in progress; resume at physical source page 491."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

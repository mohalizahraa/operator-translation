name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 32/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 32,
            "expected_previous_pages": 16,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "AHj4eMTUK9sPiBzO9OawvfcgJU3olwoeAwWRjvNbk3e0VAbDmwX_8oUtnS78rU9T3lLp15_9Syjm_7Ds_VJ3jwjn3H6dss-Lk6P_8VChK0k",
            "verification_note": "Verified source coverage through physical page 32 against the authoritative PDF hash. Pages 17-32 were translated into the live English Doc; 16 source notes were migrated as populated native Google Docs footnotes at source-relative anchors. New body readback has 0 unapproved Arabic-script hits, Qur'anic spans and sacred glyph styling were preserved, and a fresh 24-page PDF render confirmed native page-bottom footnote continuation and readable section layout."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 239/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 239,
            "expected_previous_pages": 205,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQmAAvQjKLzOj9QzxDVMarGe4JugLU7x-ebuk64h3nKxdupkxyIeEpXQbVeCMaCKIJLTPCRojP3zMQNHeEEhp_dVvs9l2hUAVQgne74",
            "verification_note": "Verified continuous English body coverage through physical source page 239 in the live Google Doc. The translated run now extends through the chapter on focusing on Imam Ali's personality, including the knowledge, practical, spiritual, guardianship, and qualification discussions. Source-note translations for later pages are preserved in explicit staging markers pending native Google Docs footnote migration. Native-footnote migration and final formatting/publication QA remain open and are not represented as complete."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

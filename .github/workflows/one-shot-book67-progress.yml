name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 110/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 110,
            "expected_previous_pages": 91,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQlb6FibN2FRhMJc8XMmvCEcc3n2e34P7EpM-2ziAPpQlNJ-skDOBREA_aQrF2k7MHGE7gZPVg-nkOAGu1_vE79X--9xdBO6TnS9TCU",
            "verification_note": "Verified continuous source coverage through physical page 110 against the authoritative 584-page PDF hash. The prior 91-page checkpoint was reconciled: omitted material spanning the page-91/92 boundary through page 94 was restored, the Ghadir section through page 96 was source-aligned, and pages 97-110 now cover the Calamity of Thursday, reactions to the first preservation measure, the three classes of objectors, Usamah-expedition resistance, and the Hawd/reversal traditions. Whole-doc native-footnote count is 132 with 0 empty notes and no temporary source-note anchors remain in the body."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

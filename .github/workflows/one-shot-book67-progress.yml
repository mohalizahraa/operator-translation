name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 15/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 15,
            "expected_previous_pages": 10,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQkDs3YjS1Y9LcLA24jOZnANJIeED6q-FbASN8xAItxWQmQ0__AY7uue6xFCVMXRVeDekVUYgfQC5zs1WjgKJlJI3wrTWwmGhN6-C28",
            "verification_note": "Verified authoritative source coverage through physical page 15 on the same 584-page PDF hash: pages 11–14 contain the translated author Introduction and page 15 is the translated Chapter One opener. Live Doc readback found 0 unapproved Arabic-script hits in the new English text; Qur'anic spans retain the approved green styling, sacred glyph runs were normalized, and a fresh PDF render verifies the Introduction and chapter-opening layout without an empty interstitial page."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

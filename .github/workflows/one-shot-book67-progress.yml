name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 440/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 440,
            "expected_previous_pages": 420,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQkavuhnt-xcB-sO3AkYpxFwU4tlL-w0-bwB7-z2HdPk9tw48o5_QcPQHZdgjProlH-GSdDK41N98hZ0UKkP8BL0eLXP4J9yZ3EXHh8",
            "verification_note": "Verified continuous English translation coverage through physical source page 440 in the live Google Doc. Chapter Nine now covers the danger and historical roots of Umayyadism, historical terror examples through al-Harrah, and their supporting source notes. Source-note text remains staged pending native-footnote migration and final formatting/publication QA; this checkpoint certifies continuous draft coverage/readback, not publication readiness."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

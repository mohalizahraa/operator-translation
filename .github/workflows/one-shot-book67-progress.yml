name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 480/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 480,
            "expected_previous_pages": 440,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQl4QZjYL82LAuh8gBkNm5CPQcYcRARxRGz2ISgCE7UK4CHPi14BxaVWsf9emoXPxHng-eAcglIBVmU18SGsO8QRIHHTT49DZpuJf0A",
            "verification_note": "Reconciled the live manuscript against the authoritative 584-page PDF/OCR source. Existing English body coverage was verified through physical source page 460, and pages 461-480 were translated into the live Google Doc and read back successfully, including headings and source-note staging text. Translation remains in progress; resume at physical source page 481."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

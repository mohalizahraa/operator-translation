name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 259/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 259,
            "expected_previous_pages": 239,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQkWSyvC1KNbaPXSaYxqIrFtiK-rX0CIsOgRWPgky2eeeePtpn04tjXIZPVV9fX2HVFGQsosZ-yQrsv_4Fzrc2O1aVG-btcs8bffSOE",
            "verification_note": "Verified continuous English translation coverage through physical source page 259 in the live Google Doc. Chapter Five has begun and the translation now includes Lady Fatimah al-Zahra's titles and attributes through al-Batul, with source-note text preserved in explicit staging markers. Native-footnote migration and final formatting/publication QA remain open and are not represented as complete."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

name: One-shot Book 67 Progress

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-progress.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 400/584 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 400,
            "expected_previous_pages": 380,
            "source_total_pages": 584,
            "source_pdf_sha256": "f42595fd7c50e10116b944351e7d59150f2cf90c7d8a93315bcea03fc6f41e0d",
            "google_doc_revision": "ANLCKQnz5BgnzYGGU24RR4J7XhH-Rs2kyRU1x6uF-vxQOp_oUL1Eqo0p-m5_n7EdIdHJlxf0wzTGwdHgXxmiRcilj_J9mg0oZOatc8OprkQ",
            "verification_note": "Verified continuous English translation coverage through physical source page 400 in the live Google Doc. Chapter Eight now covers the Usamah expedition, Saqifah, the separation-of-prophethood-and-rule argument, and the author's discussion of caliph- and Companion-level efforts to frustrate the Prophetic measures. Source-note text remains staged pending native-footnote migration and final formatting/publication QA; this checkpoint certifies continuous draft coverage/readback, not publication readiness."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/2/progress

name: One-shot Intercession Progress 152

on:
  push:
    paths:
      - '.github/workflows/one-shot-intercession-progress-152.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 152/375 translation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          progress=$(cat <<'JSON'
          {
            "translated_pages": 152,
            "expected_previous_pages": 148,
            "source_total_pages": 375,
            "source_pdf_sha256": "48d338363f4443d291c4e53365efef6eb36deb87ddfe788bb1e8559cd1c58cbf",
            "google_doc_revision": "ANLCKQn1eCPw-Pv-KVharP1lDDms60y4ppcgike5NueLaBBjVpwDu9y3CzdFWw6n58UwDM8eEuXIpXKMvzVIuUUS_QDyQYP_6HluFZerVfo",
            "verification_note": "Verified continuous Arabic-source-to-English translation through physical source page 152 of 375. Pages 149-152 complete Chapter Six: hadith evidence for tawassul through a living righteous servant, including the rain supplications and Umar's tawassul through al-Abbas, followed by the chapter observation and conclusion. Seven native footnotes were added; the manuscript now contains 316 native footnotes total. Continue sequentially from physical source page 153."
          }
          JSON
          )
          curl -fsS -X PATCH -H 'content-type: application/json' -H 'x-workbench-actor: Zahraa'             --data "$progress" https://haydari-translation-workbench.pages.dev/api/projects/5/progress
          printf '\n'
          project=$(cat <<'JSON'
          {
            "status": "in_progress",
            "notes": "Translation active. Verified physical source-page checkpoint: 152/375. Chapter Six is complete, including the three agreed-upon forms of legitimate tawassul. The manuscript now contains 316 native footnotes. Continue sequentially from physical source page 153."
          }
          JSON
          )
          curl -fsS -X PATCH -H 'content-type: application/json' -H 'x-workbench-actor: Zahraa'             --data "$project" https://haydari-translation-workbench.pages.dev/api/projects/5
          printf '\n'
      - name: Verify live Workbench readback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://haydari-translation-workbench.pages.dev/api/projects -o /tmp/projects.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/projects.json'))
          p=next(x for x in data['projects'] if int(x['id'])==5)
          assert int(p['translated_pages'])==152, p['translated_pages']
          assert p['status']=='in_progress', p['status']
          assert '152/375' in (p.get('notes') or ''), p.get('notes')
          print('INTERCESSION_PROGRESS_152_VERIFIED')
          PY

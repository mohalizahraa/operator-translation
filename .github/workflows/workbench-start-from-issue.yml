name: Workbench exact-ID manuscript start

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: workbench-start
  cancel-in-progress: false

jobs:
  start:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Workbench start:')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify start helper checks
        shell: pwsh
        run: |
          node --check workbench/scripts/start-translation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Start helper syntax failed.' }
          node --test workbench/scripts/start-translation.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Start helper checks failed.' }
      - name: Process owner-authored exact-ID start request and report result
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $issue = [int]$event.issue.number
          $result = ''
          $successful = $false
          try {
            $request = $event.issue.body | ConvertFrom-Json
            if ($null -eq $request.projectId -or $null -eq $request.permissionEvidence) {
              throw 'Request must be one JSON object with exact project fields and the caller-verified Anyone/Editor witness.'
            }
            $env:WORKBENCH_START_REQUEST = $request | ConvertTo-Json -Depth 8 -Compress
            $output = & node workbench/scripts/start-translation.mjs 2>&1
            if ($LASTEXITCODE -ne 0) { throw (($output | Out-String).Trim()) }
            $result = (($output | Out-String).Trim())
            $successful = $true
          } catch {
            $result = $_.Exception.Message
          } finally {
            Remove-Item Env:WORKBENCH_START_REQUEST -ErrorAction SilentlyContinue
          }
          $prefix = if ($successful) { 'Verified live Workbench start:' } else { 'START_OPEN - live Workbench update NOT verified:' }
          $message = "$prefix" + [Environment]::NewLine + [Environment]::NewLine + "$result"
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/$issue/comments"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'Workbench-start-runner' }
          $json = @{ body = $message } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $uri -Headers $headers -ContentType 'application/json' -Method Post -Body $json | Out-Null
          if ($successful) {
            $closeBody = @{ state = 'closed' } | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri ("https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/$issue") -Headers $headers -ContentType 'application/json' -Method Patch -Body $closeBody | Out-Null
          } else { throw $result }

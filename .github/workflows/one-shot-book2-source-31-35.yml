name: One-shot Book 2 Text 65

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-source-31-35.yml'

permissions:
  contents: read

jobs:
  render-source:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      SOURCE_URL: "https://haydari-translation-workbench.pages.dev/api/pdf/5"
      START_PAGE: "65"
      END_PAGE: "65"
    steps:
      - uses: actions/checkout@v4
      - name: Extract source page 65 text
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --connect-timeout 30 "$SOURCE_URL" -o /tmp/book2.pdf
          printf 'SOURCE_SHA256=%s\n' "$(shasum -a 256 /tmp/book2.pdf | awk '{print $1}')"
          cat >/tmp/render.swift <<'SWIFT'
          import Foundation
          import PDFKit
          guard let doc = PDFDocument(url: URL(fileURLWithPath: "/tmp/book2.pdf")) else { exit(2) }
          print("SOURCE_PAGE_COUNT=\(doc.pageCount)")
          let p = 65
          guard let page = doc.page(at: p - 1) else { exit(3) }
          print("PAGE_065_TEXT_BEGIN")
          print(page.string ?? "")
          print("PAGE_065_TEXT_END")
          SWIFT
          swift /tmp/render.swift
      - name: Cleanup
        if: always()
        run: rm -f /tmp/book2.pdf /tmp/render.swift

name: One-shot Book 2 Alternate Render 80

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-source-31-35.yml'

permissions:
  contents: read

jobs:
  render-source:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      SOURCE_URL: "https://haydari-translation-workbench.pages.dev/api/pdf/5"
    steps:
      - uses: actions/checkout@v4
      - name: Alternate-render source page 80
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --connect-timeout 30 "$SOURCE_URL" -o /tmp/book2.pdf
          printf 'SOURCE_SHA256=%s\n' "$(shasum -a 256 /tmp/book2.pdf | awk '{print $1}')"
          cat >/tmp/render.swift <<'SWIFT'
          import Foundation
          import PDFKit
          import AppKit
          guard let doc = PDFDocument(url: URL(fileURLWithPath: "/tmp/book2.pdf")),
                let page = doc.page(at: 79) else { exit(2) }
          let box = page.bounds(for: .mediaBox)
          let scale: CGFloat = 3.5
          let width = Int(box.width * scale)
          let height = Int(box.height * scale)
          guard let rep = NSBitmapImageRep(
            bitmapDataPlanes: nil, pixelsWide: width, pixelsHigh: height,
            bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true,
            isPlanar: false, colorSpaceName: .deviceRGB,
            bitmapFormat: [], bytesPerRow: 0, bitsPerPixel: 0
          ) else { exit(3) }
          NSGraphicsContext.saveGraphicsState()
          guard let ctx = NSGraphicsContext(bitmapImageRep: rep) else { exit(4) }
          NSGraphicsContext.current = ctx
          NSColor.white.setFill()
          NSRect(x:0,y:0,width:width,height:height).fill()
          ctx.cgContext.scaleBy(x: scale, y: scale)
          page.draw(with: .mediaBox, to: ctx.cgContext)
          NSGraphicsContext.restoreGraphicsState()
          guard let jpg = rep.representation(using:.jpeg,properties:[.compressionFactor:0.95]) else { exit(5) }
          let b64=jpg.base64EncodedString()
          print("PAGE_080_ALT_BEGIN")
          var i=b64.startIndex
          while i<b64.endIndex {
            let j=b64.index(i,offsetBy:30000,limitedBy:b64.endIndex) ?? b64.endIndex
            print(String(b64[i..<j])); i=j
          }
          print("PAGE_080_ALT_END")
          SWIFT
          swift /tmp/render.swift
      - name: Cleanup
        if: always()
        run: rm -f /tmp/book2.pdf /tmp/render.swift

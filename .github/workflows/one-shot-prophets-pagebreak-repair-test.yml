name: One-shot Prophets Pagebreak Repair Test

on:
  push:
    paths:
      - '.github/workflows/one-shot-prophets-pagebreak-repair-test.yml'

permissions:
  contents: read

jobs:
  repair-test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/14tlFP7t0FgdQDoDK7e6nUKOUjlv7krMgzsJB1qam0Ss/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral browser driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Remove explicit break before Introduction
        shell: bash
        run: |
          cat > ./repair-pagebreak.mjs <<'NODE'
          import { chromium } from "playwright";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:"en-US"});
          const page=await context.newPage();
          try {
            await page.goto(process.env.DOC_URL,{waitUntil:"domcontentloaded",timeout:120000});
            await sleep(9000);
            const editor=page.locator(".kix-appview-editor").first();
            if(await editor.isVisible({timeout:3000}).catch(()=>false)) await editor.click({position:{x:520,y:220},force:true});
            else await page.mouse.click(800,450);

            await page.keyboard.press("Meta+f");
            await sleep(300);
            await page.keyboard.type("Introduction",{delay:25});
            await sleep(1200);
            const close=page.getByLabel("Close",{exact:true}).first();
            if(await close.isVisible({timeout:1200}).catch(()=>false)) await close.click();
            else await page.keyboard.press("Escape");
            await sleep(700);

            // Collapse the found selection to the start of "Introduction", then delete
            // the immediately preceding explicit page-break character.
            await page.keyboard.press("ArrowLeft");
            await sleep(400);
            await page.keyboard.press("Backspace");
            await sleep(8000);
            console.log("PAGEBREAK_BACKSPACE_SENT");
          } finally {
            await browser.close();
          }
          NODE
          node ./repair-pagebreak.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./repair-pagebreak.mjs
          rm -rf /tmp/operator-playwright-browsers
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

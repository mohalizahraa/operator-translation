name: One-shot Book 67 Source Pilot

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-source-pilot.yml'

permissions:
  contents: read

jobs:
  render-source:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      SOURCE_URL: "https://archive.alhaydari.com/ebook/ar/%D8%A7%D9%84%D9%83%D9%84%D8%A7%D9%85-%D9%88%D8%A7%D9%84%D8%B9%D9%82%D8%A7%D8%A6%D8%AF/%D8%A7%D9%84%D8%AA%D8%AF%D8%A7%D8%A8%D9%8A%D8%B1-%D8%A7%D9%84%D9%86%D8%A8%D9%88%D9%8A%D8%A9-%D9%84%D8%AD%D9%81%D8%B8-%D8%A7%D9%84%D8%B1%D8%B3%D8%A7%D9%84%D8%A9-%D8%A7%D9%84%D8%A5%D9%84%D9%87%D9%8A%D8%A9.pdf"
      START_PAGE: "9"
      END_PAGE: "12"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and render authoritative Workbench PDF pages
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --connect-timeout 30 "$SOURCE_URL" -o /tmp/book67.pdf
          head -c 5 /tmp/book67.pdf | grep -q '%PDF-'
          printf 'SOURCE_SHA256=%s\n' "$(shasum -a 256 /tmp/book67.pdf | awk '{print $1}')"

          cat >/tmp/render-book67.swift <<'SWIFT'
          import Foundation
          import PDFKit
          import AppKit

          let path = "/tmp/book67.pdf"
          guard let doc = PDFDocument(url: URL(fileURLWithPath: path)) else {
            fputs("PDF_OPEN_FAILED\n", stderr)
            exit(2)
          }
          print("SOURCE_PAGE_COUNT=\(doc.pageCount)")
          let start = max(1, Int(ProcessInfo.processInfo.environment["START_PAGE"] ?? "1") ?? 1)
          let end = min(doc.pageCount, Int(ProcessInfo.processInfo.environment["END_PAGE"] ?? "\(start)") ?? start)
          for physical in start...end {
            guard let page = doc.page(at: physical - 1) else { continue }
            let thumb = page.thumbnail(of: NSSize(width: 1200, height: 1700), for: .mediaBox)
            guard let tiff = thumb.tiffRepresentation,
                  let rep = NSBitmapImageRep(data: tiff),
                  let png = rep.representation(using: .png, properties: [:]) else { continue }
            print(String(format: "PAGE_%03d_B64=", physical) + png.base64EncodedString())
          }
          SWIFT
          swift /tmp/render-book67.swift
      - name: Cleanup
        if: always()
        run: rm -f /tmp/book67.pdf /tmp/render-book67.swift

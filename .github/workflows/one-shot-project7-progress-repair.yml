name: One-shot Project 7 Progress Repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-project7-progress-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 8
    steps:
      - name: Publish current verified marker into live Workbench D1
        shell: bash
        run: |
          set -euo pipefail
          base='https://haydari-translation-workbench.pages.dev'
          sync="$base/api/projects/7/progress-sync"

          curl -fsS --retry 3 --connect-timeout 20 "$sync" -o /tmp/p7-before.json
          read -r current marker total export_sha <<EOF
          $(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p7-before.json'))
          assert d.get('marker_found') is True, d
          p=d['project']
          print(int(p.get('translated_pages') or 0), int(d['marker_pages']), int(d['marker_total']), d['export_sha256'])
          PY
          )
          EOF

          if [ "$marker" -le "$current" ]; then
            echo "PROJECT7_ALREADY_SYNCHRONIZED=$current/$total"
          else
            curl -fsS --retry 3 --connect-timeout 20 "$base/api/pdf/7" -o /tmp/p7-source.pdf
            test "$(head -c 4 /tmp/p7-source.pdf)" = '%PDF'
            source_sha="$(shasum -a 256 /tmp/p7-source.pdf | awk '{print $1}')"

            python3 - "$marker" "$current" "$total" "$source_sha" "$export_sha" <<'PY'
          import json,sys
          marker,current,total,source_sha,export_sha=sys.argv[1:]
          payload={
            'translated_pages':int(marker),
            'expected_previous_pages':int(current),
            'source_total_pages':int(total),
            'source_pdf_sha256':source_sha,
            'google_doc_revision':'public-export-sha256:'+export_sha,
            'verification_note':'One-shot repair: publish the exact verified WBPROGRESS marker after detecting Google Doc / D1 drift.',
          }
          json.dump(payload,open('/tmp/p7-payload.json','w'))
          PY

            curl -fsS --retry 3 --connect-timeout 20 -X PATCH               -H 'content-type: application/json'               -H 'x-workbench-actor: Zahraa'               --data-binary @/tmp/p7-payload.json               "$base/api/projects/7/progress"               -o /tmp/p7-published.json
            cat /tmp/p7-published.json
          fi

          curl -fsS --retry 3 --connect-timeout 20 "$sync" -o /tmp/p7-after.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p7-after.json'))
          p=d['project']
          marker=int(d['marker_pages'])
          stored=int(p.get('translated_pages') or 0)
          total=int(d['marker_total'])
          assert stored==marker, (stored,marker)
          expected='review' if marker>=total else 'in_progress'
          assert p['status']==expected, (p['status'],expected)
          print(f'PROJECT7_LIVE_WORKBENCH_VERIFIED={stored}/{total}:{expected}')
          PY


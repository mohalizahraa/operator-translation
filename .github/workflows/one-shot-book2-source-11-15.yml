name: One-shot Book 2 Source 11-15

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-source-11-15.yml'

permissions:
  contents: read

jobs:
  render-source:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      SOURCE_URL: "https://haydari-translation-workbench.pages.dev/api/pdf/5"
      START_PAGE: "11"
      END_PAGE: "15"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and render canonical Workbench PDF pages 11-15
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --connect-timeout 30 "$SOURCE_URL" -o /tmp/book2.pdf
          head -c 5 /tmp/book2.pdf | grep -q '%PDF-'
          printf 'SOURCE_SHA256=%s\n' "$(shasum -a 256 /tmp/book2.pdf | awk '{print $1}')"

          cat >/tmp/render-book2.swift <<'SWIFT'
          import Foundation
          import PDFKit
          import AppKit
          let path = "/tmp/book2.pdf"
          guard let doc = PDFDocument(url: URL(fileURLWithPath: path)) else { exit(2) }
          print("SOURCE_PAGE_COUNT=\(doc.pageCount)")
          let start = Int(ProcessInfo.processInfo.environment["START_PAGE"]!)!
          let end = Int(ProcessInfo.processInfo.environment["END_PAGE"]!)!
          for physical in start...end {
            guard let page = doc.page(at: physical - 1) else { continue }
            let thumb = page.thumbnail(of: NSSize(width: 1400, height: 1980), for: .mediaBox)
            guard let tiff = thumb.tiffRepresentation,
                  let rep = NSBitmapImageRep(data: tiff),
                  let jpg = rep.representation(using: .jpeg, properties: [.compressionFactor: 0.90]) else { continue }
            let b64 = jpg.base64EncodedString()
            print(String(format: "PAGE_%03d_BEGIN", physical))
            var i = b64.startIndex
            while i < b64.endIndex {
              let j = b64.index(i, offsetBy: 30000, limitedBy: b64.endIndex) ?? b64.endIndex
              print(String(b64[i..<j]))
              i = j
            }
            print(String(format: "PAGE_%03d_END", physical))
          }
          SWIFT
          swift /tmp/render-book2.swift
      - name: Cleanup
        if: always()
        run: rm -f /tmp/book2.pdf /tmp/render-book2.swift

name: One-shot Workbench Dashboard Acceptance

on:
  push:
    paths:
      - '.github/workflows/one-shot-workbench-dashboard-acceptance.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Workbench acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          cd workbench
          npm run check:acceptance

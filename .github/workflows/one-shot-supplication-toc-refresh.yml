name: One-shot Supplication TOC Refresh

on:
  push:
    paths:
      - '.github/workflows/one-shot-supplication-toc-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/15MMgcj6TPtdCotBecPUJW9xX59-Py_ODsHqRqh_dDLc/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral browser driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Refresh native Google Docs TOC
        shell: bash
        run: |
          cat > ./refresh-supplication-toc.mjs <<'NODE'
          import { chromium } from "playwright";
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1440,height:1000},locale:"en-US"});
          const page = await context.newPage();
          try {
            await page.goto(process.env.DOC_URL,{waitUntil:"domcontentloaded",timeout:120000});
            await sleep(8000);
            const editor = page.locator(".kix-appview-editor").first();
            if (await editor.isVisible({timeout:3000}).catch(()=>false)) {
              await editor.click({position:{x:160,y:180}});
            } else {
              await page.mouse.click(800,450);
            }
            await page.keyboard.press("Meta+f");
            await sleep(300);
            await page.keyboard.type("Introduction",{delay:25});
            await sleep(700);
            const close = page.getByLabel("Close",{exact:true}).first();
            if (await close.isVisible({timeout:1200}).catch(()=>false)) await close.click();
            else await page.keyboard.press("Escape");
            await sleep(500);
            await page.keyboard.press("ArrowRight");
            await sleep(700);
            const candidates=[
              page.getByLabel(/(?:Refresh|Update) table of contents/i).last(),
              page.getByLabel(/^(?:Refresh|Update)$/i).last(),
              page.locator('[aria-label*="Refresh" i][aria-label*="table" i]').last(),
              page.locator('[aria-label*="Update" i][aria-label*="table" i]').last(),
              page.locator('[data-tooltip*="Refresh" i][data-tooltip*="table" i]').last(),
              page.locator('[data-tooltip*="Update" i][data-tooltip*="table" i]').last()
            ];
            let clicked=false;
            for (const loc of candidates) {
              if (await loc.isVisible({timeout:1400}).catch(()=>false)) {
                await loc.click(); clicked=true; break;
              }
            }
            if (!clicked) throw new Error("Native TOC refresh control not found");
            await sleep(7000);
            console.log("NATIVE_TOC_REFRESH_COMPLETED");
          } finally {
            await browser.close();
          }
          NODE
          node ./refresh-supplication-toc.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./refresh-supplication-toc.mjs
          rm -rf /tmp/operator-playwright-browsers
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

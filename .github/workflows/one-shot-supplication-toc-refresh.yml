name: One-shot Supplication TOC Refresh

on:
  push:
    paths:
      - '.github/workflows/one-shot-supplication-toc-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/15MMgcj6TPtdCotBecPUJW9xX59-Py_ODsHqRqh_dDLc/edit
      TOC_ACTION: refresh
      CONTENTS_LABEL: Contents
      TOC_VARIANT: dots-page-numbers
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch canonical native-TOC driver
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/mohalizahraa/operator-protocol/main/scripts/google-docs-native-toc.mjs \
            -o /tmp/google-docs-native-toc.mjs
          node --check /tmp/google-docs-native-toc.mjs
      - name: Install ephemeral browser driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Refresh native Google Docs TOC
        run: node /tmp/google-docs-native-toc.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f /tmp/google-docs-native-toc.mjs
          rm -rf /tmp/operator-playwright-browsers
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

name: One-shot Project 7 Needs Review

on:
  push:
    paths:
      - '.github/workflows/one-shot-project7-needs-review.yml'

permissions:
  contents: read

jobs:
  advance:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 8
    steps:
      - name: Advance project 7 to Needs Review and verify live readback
        shell: bash
        run: |
          set -euo pipefail
          base='https://haydari-translation-workbench.pages.dev'
          curl -fsS --retry 3 --connect-timeout 20 -X PATCH             -H 'content-type: application/json'             -H 'x-workbench-actor: Zahraa'             --data '{"status":"completed"}'             "$base/api/projects/7"             -o /tmp/project7-status.json
          cat /tmp/project7-status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/project7-status.json'))
          p=d['project']
          assert p['status']=='completed', p
          assert int(p['translated_pages'])==int(p['pages'])==219, p
          print('PROJECT7_NEEDS_REVIEW_VERIFIED=219/219')
          PY

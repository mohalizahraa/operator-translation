name: One-shot Book 2 Source 30 Retry

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-source-30-retry.yml'

permissions:
  contents: read

jobs:
  render-source:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Render source page 30
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --connect-timeout 30 "https://haydari-translation-workbench.pages.dev/api/pdf/5" -o /tmp/book2.pdf
          cat >/tmp/render.swift <<'SWIFT'
          import Foundation
          import PDFKit
          import AppKit
          guard let doc = PDFDocument(url: URL(fileURLWithPath: "/tmp/book2.pdf")),
                let page = doc.page(at: 29) else { exit(2) }
          let img = page.thumbnail(of: NSSize(width: 900, height: 1273), for: .mediaBox)
          guard let tiff=img.tiffRepresentation,
                let rep=NSBitmapImageRep(data:tiff),
                let jpg=rep.representation(using:.jpeg,properties:[.compressionFactor:0.82]) else { exit(3) }
          print("PAGE_030_BEGIN")
          let b64=jpg.base64EncodedString()
          var i=b64.startIndex
          while i<b64.endIndex {
            let j=b64.index(i,offsetBy:20000,limitedBy:b64.endIndex) ?? b64.endIndex
            print(String(b64[i..<j])); i=j
          }
          print("PAGE_030_END")
          SWIFT
          swift /tmp/render.swift
      - name: Cleanup
        if: always()
        run: rm -f /tmp/book2.pdf /tmp/render.swift

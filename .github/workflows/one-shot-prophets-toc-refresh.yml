name: One-shot Prophets TOC Refresh

on:
  push:
    paths:
      - '.github/workflows/one-shot-prophets-toc-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/1KJBqjZ41Zasg_LqrKNr4wJXZCkpOcJ77PXQal2KU1qM/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral browser driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Refresh native Google Docs TOC after whole-book pagination
        shell: bash
        run: |
          # Trigger: terminal fixed-point refresh after removing the trailing blank page.
          cat > ./refresh-prophets-toc.mjs <<'NODE'
          import { chromium } from "playwright";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:"en-US"});
          const page=await context.newPage();

          async function clickRefresh(){
            const shell=page.getByLabel("Table of contents",{exact:true}).last();
            if(await shell.count().catch(()=>0)){
              try{
                await shell.scrollIntoViewIfNeeded().catch(()=>{});
                await shell.click({force:true});
                await sleep(600);
                const exact=page.getByLabel("Update table of contents",{exact:true}).last();
                if(await exact.isVisible({timeout:1500}).catch(()=>false)){
                  await exact.click({force:true});
                  console.log("TOC_REFRESH_VISIBLE_CLICK");
                  return true;
                }
              }catch{}
            }
            const candidates=[
              page.getByLabel(/(?:Refresh|Update) table of contents/i).last(),
              page.getByLabel(/^(?:Refresh|Update)$/i).last(),
              page.locator('[aria-label*="Refresh" i][aria-label*="table" i]').last(),
              page.locator('[aria-label*="Update" i][aria-label*="table" i]').last(),
              page.locator('[data-tooltip*="Refresh" i][data-tooltip*="table" i]').last(),
              page.locator('[data-tooltip*="Update" i][data-tooltip*="table" i]').last(),
              page.locator('[title*="Refresh" i][title*="table" i]').last(),
              page.locator('[title*="Update" i][title*="table" i]').last()
            ];
            for(const loc of candidates){
              if(await loc.isVisible({timeout:500}).catch(()=>false)){
                await loc.click({force:true});
                return true;
              }
            }
            return false;
          }

          async function findAndSettle(query, settle=2200){
            await page.keyboard.press("Meta+f");
            await sleep(300);
            await page.keyboard.type(query,{delay:18});
            await sleep(900);
            const close=page.getByLabel("Close",{exact:true}).first();
            if(await close.isVisible({timeout:1200}).catch(()=>false)) await close.click();
            else await page.keyboard.press("Escape");
            await sleep(settle);
          }

          try{
            await page.goto(process.env.DOC_URL,{waitUntil:"domcontentloaded",timeout:120000});
            await sleep(12000);

            const editor=page.locator(".kix-appview-editor").first();
            if(await editor.isVisible({timeout:3000}).catch(()=>false)) {
              await editor.click({position:{x:520,y:220},force:true});
            } else {
              await page.mouse.click(800,450);
            }

            // Touch the major boundaries in document order so Docs computes the full pagination.
            const anchors=[
              "Introduction",
              "Part One — Foundational Preliminaries",
              "Part Two — Stages of Infallibility and Ways of Establishing It",
              "First Study: Infallibility in Fulfilling Obligations and Avoiding Prohibitions",
              "The Story of Joseph",
              "Second Study: Infallibility in Receiving and Conveying Revelation",
              "Third Study: Infallibility in Application",
              "Fourth Study: Infallibility in the Affairs of Ordinary Life",
              "A Fragrant Conclusion"
            ];
            for(const anchor of anchors){
              console.log("PAGINATE_ANCHOR="+anchor);
              await findAndSettle(anchor,2200);
            }

            await findAndSettle("Contents",1800);

            const probes = await page.locator('[aria-label], [title], [data-tooltip]').evaluateAll(els =>
              els.map(el => ({
                tag: el.tagName,
                aria: el.getAttribute('aria-label'),
                title: el.getAttribute('title'),
                tip: el.getAttribute('data-tooltip'),
                text: (el.textContent || '').trim().slice(0,120)
              })).filter(x => /(?:contents|introduction|refresh|update|table of contents)/i.test(
                [x.aria,x.title,x.tip,x.text].filter(Boolean).join(' ')
              )).slice(0,80)
            ).catch(()=>[]);
            console.log("TOC_DOM_PROBES="+JSON.stringify(probes));

            const directTargets=[
              page.getByRole('link',{name:/^Introduction/i}).first(),
              page.locator('[aria-label^="Introduction" i]').first(),
              page.locator('[aria-label*="Introduction" i]').first(),
              page.getByText(/^Introduction(?:\\s+\\d+)?$/i).first(),
              page.locator('.kix-lineview-content').filter({hasText:/Introduction/i}).first()
            ];
            for(const target of directTargets){
              if(await target.isVisible({timeout:700}).catch(()=>false)){
                console.log("TOC_DIRECT_TARGET_VISIBLE");
                await target.click({force:true}).catch(()=>{});
                await sleep(700);
                if(await clickRefresh()){
                  console.log("NATIVE_TOC_REFRESH_COMPLETED_DIRECT");
                  await sleep(9000);
                  process.exit(0);
                }
              }
            }

            for(const key of ["ArrowRight","End","ArrowDown","ArrowDown"]){
              await page.keyboard.press(key).catch(()=>{});
              await sleep(400);
              if(await clickRefresh()){
                console.log("NATIVE_TOC_REFRESH_COMPLETED_KEYBOARD");
                await sleep(9000);
                process.exit(0);
              }
            }

            const pages=page.locator(".kix-page-paginated:visible");
            const count=await pages.count();
            console.log("VISIBLE_PAGE_COUNT="+count);
            let clicked=false;
            for(let i=0;i<count && !clicked;i++){
              const b=await pages.nth(i).boundingBox().catch(()=>null);
              console.log("VISIBLE_PAGE_BOX_"+i+"="+JSON.stringify(b));
              if(!b) continue;
              const points=[
                [0.25,0.16],[0.50,0.16],[0.75,0.16],
                [0.25,0.28],[0.50,0.28],[0.75,0.28],
                [0.25,0.42],[0.50,0.42],[0.75,0.42],
                [0.35,0.58],[0.60,0.58]
              ];
              for(const [xr,yr] of points){
                await page.mouse.click(b.x+b.width*xr,b.y+b.height*yr);
                await sleep(350);
                if(await clickRefresh()){clicked=true;break;}
              }
            }
            if(!clicked) throw new Error("Native TOC refresh control not found after whole-book pagination pass");
            await sleep(9000);
            console.log("NATIVE_TOC_REFRESH_COMPLETED");
          }finally{
            await browser.close();
          }
          NODE
          node ./refresh-prophets-toc.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./refresh-prophets-toc.mjs
          rm -rf /tmp/operator-playwright-browsers
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

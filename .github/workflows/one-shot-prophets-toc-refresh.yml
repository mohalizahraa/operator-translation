name: One-shot Prophets TOC Refresh

on:
  push:
    paths:
      - '.github/workflows/one-shot-prophets-toc-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/1KJBqjZ41Zasg_LqrKNr4wJXZCkpOcJ77PXQal2KU1qM/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral browser driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Refresh native Google Docs TOC
        shell: bash
        run: |
          cat > ./refresh-prophets-toc.mjs <<'NODE'
          import { chromium } from "playwright";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:"en-US"});
          const page=await context.newPage();
          async function refreshVisible(){
            const candidates=[
              page.getByLabel(/(?:Refresh|Update) table of contents/i).last(),
              page.getByLabel(/^(?:Refresh|Update)$/i).last(),
              page.locator('[aria-label*="Refresh" i][aria-label*="table" i]').last(),
              page.locator('[aria-label*="Update" i][aria-label*="table" i]').last(),
              page.locator('[data-tooltip*="Refresh" i][data-tooltip*="table" i]').last(),
              page.locator('[data-tooltip*="Update" i][data-tooltip*="table" i]').last(),
              page.getByText(/(?:Refresh|Update) table of contents/i,{exact:false}).last()
            ];
            for(const loc of candidates){
              if(await loc.isVisible({timeout:800}).catch(()=>false)){
                await loc.click({force:true}); return true;
              }
            }
            return false;
          }
          try{
            await page.goto(process.env.DOC_URL,{waitUntil:"domcontentloaded",timeout:120000});
            await sleep(9000);
            const pages=page.locator(".kix-page-paginated");
            const count=await pages.count();
            console.log("DOC_PAGE_DOM_COUNT="+count);
            if(count<6) throw new Error("Fewer than six Google Docs page elements were available");
            const tocPage=pages.nth(5);
            await tocPage.scrollIntoViewIfNeeded();
            await sleep(1200);
            const b=await tocPage.boundingBox();
            console.log("TOC_PAGE_BOX="+JSON.stringify(b));
            if(!b) throw new Error("Could not resolve TOC page bounds");
            const points=[
              [0.35,0.24],[0.50,0.28],[0.35,0.35],[0.55,0.42],[0.45,0.55]
            ];
            let clicked=false;
            for(const [xr,yr] of points){
              await page.mouse.click(b.x+b.width*xr,b.y+b.height*yr);
              await sleep(600);
              if(await refreshVisible()){clicked=true;break;}
            }
            if(!clicked) throw new Error("Native TOC refresh control not found after direct TOC-page targeting");
            await sleep(7000);
            console.log("NATIVE_TOC_REFRESH_COMPLETED");
          }finally{await browser.close();}
          NODE
          node ./refresh-prophets-toc.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./refresh-prophets-toc.mjs
          rm -rf /tmp/operator-playwright-browsers
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright

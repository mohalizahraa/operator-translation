name: One-shot Intercession Progress 104

on:
  push:
    paths:
      - '.github/workflows/one-shot-intercession-progress-104.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 104/375 translation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          progress=$(cat <<'JSON'
          {
            "translated_pages": 104,
            "expected_previous_pages": 96,
            "source_total_pages": 375,
            "source_pdf_sha256": "48d338363f4443d291c4e53365efef6eb36deb87ddfe788bb1e8559cd1c58cbf",
            "google_doc_revision": "ANLCKQm1j4D24uh5jqyPGDFk9N1m_tcZ08gLY45GtvCwtpjisNDpASy5QaLrobiKsLTMCYYTfLYm1S5Nyzn53qt7mlPcniNux5GOonjh2tI",
            "verification_note": "Verified continuous Arabic-source-to-English translation through physical source page 104 of 375. Pages 97-104 complete the remaining scholars' statements on grave visitation, the argument for women visiting graves, the fiṭrah discussion, and the opening objectives of grave visitation through the second hadith on benefiting the deceased. All 23 source notes added in this tranche are native Google Docs footnotes; the manuscript now contains 217 native footnotes total. No residual source-footnote placeholders remain. Continue sequentially from physical source page 105."
          }
          JSON
          )
          curl -fsS -X PATCH -H 'content-type: application/json' -H 'x-workbench-actor: Zahraa'             --data "$progress" https://haydari-translation-workbench.pages.dev/api/projects/5/progress
          printf '\n'
          project=$(cat <<'JSON'
          {
            "status": "in_progress",
            "notes": "Translation active. Verified physical source-page checkpoint: 104/375. Pages 97-104 are source-verified in the live English Doc; 23 new native footnotes were added in this tranche, 217 native footnotes total. Continue sequentially from physical source page 105."
          }
          JSON
          )
          curl -fsS -X PATCH -H 'content-type: application/json' -H 'x-workbench-actor: Zahraa'             --data "$project" https://haydari-translation-workbench.pages.dev/api/projects/5
          printf '\n'
      - name: Verify live Workbench readback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://haydari-translation-workbench.pages.dev/api/projects -o /tmp/projects.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/projects.json'))
          p=next(x for x in data['projects'] if int(x['id'])==5)
          assert int(p['translated_pages'])==104, p['translated_pages']
          assert p['status']=='in_progress', p['status']
          print('INTERCESSION_PROGRESS_104_VERIFIED')
          PY

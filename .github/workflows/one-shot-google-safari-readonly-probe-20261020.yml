name: Google sharing — Safari read-only automation probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-google-safari-readonly-probe-20261020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 3
    steps:
      - name: Test Safari interactivity without reading cookies, document text, or secrets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/safari-presence.applescript" <<'AS'
          with timeout of 8 seconds
            try
              tell application "Safari"
                set wins to count of windows
                if wins = 0 then
                  return "SAFARI_AUTOMATION_OK_NO_WINDOWS"
                end if
                set currentUrl to URL of current tab of front window
                if currentUrl starts with "https://accounts.google.com/" or currentUrl starts with "https://docs.google.com/" or currentUrl starts with "https://drive.google.com/" then
                  return "SAFARI_AUTOMATION_OK_GOOGLE_TAB"
                end if
                return "SAFARI_AUTOMATION_OK_OTHER_TAB"
              end tell
            on error errText number errNum
              return "SAFARI_AUTOMATION_BLOCKED_" & (errNum as string)
            end try
          end timeout
          AS
          /usr/bin/osascript "$RUNNER_TEMP/safari-presence.applescript" || true
          rm -f "$RUNNER_TEMP/safari-presence.applescript"
          if [ -e "$HOME/.config/rclone/rclone.conf" ]; then echo 'RCLONE_CONFIG_PRESENT=true'; fi
          if [ -e "$HOME/.config/gcloud/application_default_credentials.json" ]; then echo 'GOOGLE_ADC_PRESENT=true'; fi
          printf 'READ_ONLY_NO_GOOGLE_DATA_EXTRACTED=true\n'

name: One-shot Workbench Live Runtime Verification

on:
  push:
    paths:
      - '.github/workflows/one-shot-workbench-live-runtime.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - name: Install ephemeral browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify live Workbench dashboard runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');

          const url = 'https://haydari-translation-workbench.pages.dev/';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', err => pageErrors.push(String(err)));

            let snapshot = null;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(2500);
              snapshot = await page.evaluate(() => ({
                ratio: document.querySelector('#translation-ratio')?.textContent?.trim() || '',
                now: document.querySelector('#now-list')?.innerText?.trim() || '',
                pace: document.querySelector('#pace-summary')?.innerText?.trim() || '',
                errorHidden: document.querySelector('#workspace-error')?.hidden ?? false,
                errorText: document.querySelector('#workspace-error')?.innerText?.trim() || '',
              }));
              if (
                snapshot.errorHidden &&
                snapshot.ratio &&
                snapshot.ratio !== '0 / 0' &&
                snapshot.now.includes('Translating') &&
                snapshot.now.includes('Needs formatting') &&
                snapshot.now.includes('Needs review') &&
                snapshot.pace.includes('Recent pace') &&
                snapshot.pace.includes('At this rate')
              ) break;
              if (attempt < 8) await sleep(4000);
            }

            console.log('WORKBENCH_RUNTIME_SNAPSHOT=' + JSON.stringify(snapshot));
            console.log('WORKBENCH_CONSOLE_ERRORS=' + JSON.stringify(consoleErrors));
            console.log('WORKBENCH_PAGE_ERRORS=' + JSON.stringify(pageErrors));

            if (!snapshot?.errorHidden) throw new Error('Live-data failure panel is visible.');
            if (!snapshot?.ratio || snapshot.ratio === '0 / 0') throw new Error('Translation ratio did not hydrate.');
            for (const label of ['Translating','Needs formatting','Needs review']) {
              if (!snapshot.now.includes(label)) throw new Error('Missing dashboard workflow label: ' + label);
            }
            for (const label of ['Recent pace','At this rate']) {
              if (!snapshot.pace.includes(label)) throw new Error('Missing pace panel label: ' + label);
            }
            if (consoleErrors.length) throw new Error('Console errors: ' + consoleErrors.join(' | '));
            if (pageErrors.length) throw new Error('Page errors: ' + pageErrors.join(' | '));

            await browser.close();
            console.log('WORKBENCH_LIVE_RUNTIME_OK');
          })().catch(async error => {
            console.error(error);
            process.exit(1);
          });
          NODE

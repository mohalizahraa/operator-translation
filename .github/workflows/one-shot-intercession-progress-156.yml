name: One-shot Intercession Progress 156

on:
  push:
    paths:
      - '.github/workflows/one-shot-intercession-progress-156.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 156/375 translation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          progress=$(cat <<'JSON'
          {
            "translated_pages": 156,
            "expected_previous_pages": 152,
            "source_total_pages": 375,
            "source_pdf_sha256": "48d338363f4443d291c4e53365efef6eb36deb87ddfe788bb1e8559cd1c58cbf",
            "google_doc_revision": "ANLCKQnY4Ql8CeoPDtobUDGbkp0TlqBuJcYmrvMLDn9pFOMTb1QgZ45AS-d_iZbAIuCQMteCgU_lklr323cq73F6pNWwxIBVps9D0zUFf-E",
            "verification_note": "Verified continuous Arabic-source-to-English translation through physical source page 156 of 375. Pages 153-156 open Chapter Seven, account for blank physical page 154, define the two forms of tawassul through the Prophet, and begin the positions on asking the Prophet to supplicate after death. Four native footnotes were added; the manuscript now contains 320 native footnotes total. Continue sequentially from physical source page 157."
          }
          JSON
          )
          curl -fsS -X PATCH -H 'content-type: application/json' -H 'x-workbench-actor: Zahraa'             --data "$progress" https://haydari-translation-workbench.pages.dev/api/projects/5/progress
          printf '\n'
          project=$(cat <<'JSON'
          {
            "status": "in_progress",
            "notes": "Translation active. Verified physical source-page checkpoint: 156/375. Chapter Seven has begun; the manuscript now contains 320 native footnotes. Continue sequentially from physical source page 157."
          }
          JSON
          )
          curl -fsS -X PATCH -H 'content-type: application/json' -H 'x-workbench-actor: Zahraa'             --data "$project" https://haydari-translation-workbench.pages.dev/api/projects/5
          printf '\n'
      - name: Verify live Workbench readback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://haydari-translation-workbench.pages.dev/api/projects -o /tmp/projects.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/projects.json'))
          p=next(x for x in data['projects'] if int(x['id'])==5)
          assert int(p['translated_pages'])==156, p['translated_pages']
          assert p['status']=='in_progress', p['status']
          assert '156/375' in (p.get('notes') or ''), p.get('notes')
          print('INTERCESSION_PROGRESS_156_VERIFIED')
          PY

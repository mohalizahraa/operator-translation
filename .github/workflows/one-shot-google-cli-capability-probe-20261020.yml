name: Google sharing — existing OAuth clients capability check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-google-cli-capability-probe-20261020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 3
    steps:
      - name: Presence-only check of preauthorized public-sharing routes
        shell: bash
        run: |
          set -euo pipefail
          for t in clasp gdrive drive google-drive-ocamlfuse rclone gcloud firefox node python3; do
            if command -v "$t" >/dev/null 2>&1; then
              printf 'HAS_%s=true\n' "$t"
            else
              printf 'HAS_%s=false\n' "$t"
            fi
          done
          for f in "$HOME/.clasprc.json" "$HOME/.config/clasp/.clasprc.json" "$HOME/.config/gdrive/token_v2.json" "$HOME/.config/drive/credentials.json"; do
            if [ -f "$f" ]; then
              printf 'HAS_AUTH_CONFIG_PATTERN=true\n'
            fi
          done
          if [ -x "/Applications/Google Drive.app/Contents/MacOS/Google Drive" ]; then
            echo 'HAS_GOOGLE_DRIVE_DESKTOP=true'
          fi
          # No credentials, cookie contents, environment secrets, or book text are inspected.

name: One-shot Book 67 OCR Gap Artifact

on:
  push:
    paths:
      - '.github/workflows/one-shot-book67-ocr-gap-artifact.yml'

permissions:
  contents: write

jobs:
  ocr-gap:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    env:
      SOURCE_URL: "https://archive.alhaydari.com/ebook/ar/%D8%A7%D9%84%D9%83%D9%84%D8%A7%D9%85-%D9%88%D8%A7%D9%84%D8%B9%D9%82%D8%A7%D8%A6%D8%AF/%D8%A7%D9%84%D8%AA%D8%AF%D8%A7%D8%A8%D9%8A%D8%B1-%D8%A7%D9%84%D9%86%D8%A8%D9%88%D9%8A%D8%A9-%D9%84%D8%AD%D9%81%D8%B8-%D8%A7%D9%84%D8%B1%D8%B3%D8%A7%D9%84%D8%A9-%D8%A7%D9%84%D8%A5%D9%84%D9%87%D9%8A%D8%A9.pdf"
      START_PAGE: "91"
      END_PAGE: "91"
      POINTER_PATH: "workbench/handoffs/book67-ocr-gap-run.json"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish gap run pointer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$POINTER_PATH")"
          cat >"$POINTER_PATH" <<JSON
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "trigger_sha": "${GITHUB_SHA}",
            "start_page": ${START_PAGE},
            "end_page": ${END_PAGE},
            "artifact_name": "book67-ocr-pages-${START_PAGE}-${END_PAGE}",
            "state": "started"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$POINTER_PATH"
          git commit -m "workbench: record Book 67 OCR gap run ${GITHUB_RUN_ID}" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fetch and OCR authoritative gap pages
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --connect-timeout 30 "$SOURCE_URL" -o /tmp/book67-gap.pdf
          head -c 5 /tmp/book67-gap.pdf | grep -q '%PDF-'
          rm -rf /tmp/book67-gap-ocr
          mkdir -p /tmp/book67-gap-ocr/pages
          cat >/tmp/ocr-book67-gap.swift <<'SWIFT'
          import Foundation
          import PDFKit
          import AppKit
          import Vision
          guard let doc = PDFDocument(url: URL(fileURLWithPath: "/tmp/book67-gap.pdf")) else { exit(2) }
          let env = ProcessInfo.processInfo.environment
          let start = Int(env["START_PAGE"] ?? "91") ?? 91
          let end = Int(env["END_PAGE"] ?? "91") ?? 91
          let outDir = URL(fileURLWithPath: "/tmp/book67-gap-ocr/pages", isDirectory: true)
          for physical in start...end {
            guard let page = doc.page(at: physical - 1) else { continue }
            let img = page.thumbnail(of: NSSize(width: 2400, height: 3400), for: .mediaBox)
            guard let cg = img.cgImage(forProposedRect: nil, context: nil, hints: nil) else { continue }
            let req = VNRecognizeTextRequest()
            req.recognitionLevel = .accurate
            req.usesLanguageCorrection = true
            if (try? req.supportedRecognitionLanguages()).map({ $0.contains("ar-SA") }) == true { req.recognitionLanguages = ["ar-SA"] }
            try VNImageRequestHandler(cgImage: cg, options: [:]).perform([req])
            let obs = (req.results ?? []).sorted {
              let ay = $0.boundingBox.midY, by = $1.boundingBox.midY
              if abs(ay - by) > 0.012 { return ay > by }
              return $0.boundingBox.midX > $1.boundingBox.midX
            }
            let text = obs.compactMap { $0.topCandidates(1).first?.string }.joined(separator: "\n")
            try text.write(to: outDir.appendingPathComponent(String(format: "%03d.txt", physical)), atomically: true, encoding: .utf8)
          }
          try "{\"physical_page_count\":\(doc.pageCount),\"start_page\":\(start),\"end_page\":\(end)}".write(toFile:"/tmp/book67-gap-ocr/manifest.json", atomically:true, encoding:.utf8)
          SWIFT
          swift /tmp/ocr-book67-gap.swift
          shasum -a 256 /tmp/book67-gap.pdf | awk '{print $1}' >/tmp/book67-gap-ocr/source.sha256
          test "$(find /tmp/book67-gap-ocr/pages -type f | wc -l | tr -d ' ')" -eq 1
      - name: Upload gap OCR artifact
        uses: actions/upload-artifact@v4
        with:
          name: book67-ocr-pages-91-91
          path: /tmp/book67-gap-ocr
          if-no-files-found: error
          retention-days: 1
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/book67-gap.pdf /tmp/book67-gap-ocr /tmp/ocr-book67-gap.swift

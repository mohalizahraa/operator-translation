name: Workbench Acceptance

on:
  push:
    paths:
      - 'workbench/public/**'
      - 'workbench/functions/**'
      - 'workbench/scripts/**'
      - 'workbench/engine/**'
      - 'workbench/package.json'
      - 'workbench/schema.sql'
      - 'workbench/TRANSLATION-WORKFLOW.md'
      - '.github/workflows/workbench-acceptance.yml'

concurrency:
  group: workbench-acceptance-${{ github.ref }}
  # The active PR/head supersedes older checks; do not burn scarce self-hosted
  # runner capacity on a stale commit. Separate branches/PRs remain isolated.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Workbench acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          cd workbench
          npm run check:acceptance

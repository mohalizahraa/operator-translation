name: One-shot Book 2 Progress 50

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-progress-35.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 50/375 translation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 50,
            "expected_previous_pages": 45,
            "source_total_pages": 375,
            "source_pdf_sha256": "48d338363f4443d291c4e53365efef6eb36deb87ddfe788bb1e8559cd1c58cbf",
            "google_doc_revision": "ANLCKQmainuN1MG-M5oBlGHXN55dCxd1okyiaPFoZLFHlBdVKVzZ0WaWBEocQ793AmGKqDumLopAJSLGkwBTS_8wJ_bO7esuja0M1eAxII0",
            "verification_note": "Verified English coverage through physical source page 50 in the linked Google Doc. Pages 46-49 continue the evidence for barzakhī life, expand the philosophical discussion of death, and open the second issue concerning the Prophet\u0027s connection with the world after death. Page 50 presents the first view, attributed to Ibn Taymiyyah and Ibn Bāz, that the connection is severed apart from limited exceptions; the final sentence continues onto page 51. All 10 source footnotes from pages 46-50 are native Google Docs footnotes; the manuscript now has 76 native footnotes total. Zero readable Arabic runs were found in the checked English text surfaces. Translation remains in progress; continue sequentially from physical page 51."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/5/progress

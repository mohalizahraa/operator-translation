name: One-shot Book 2 Progress 70

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-progress-35.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 70/375 translation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 70,
            "expected_previous_pages": 60,
            "source_total_pages": 375,
            "source_pdf_sha256": "48d338363f4443d291c4e53365efef6eb36deb87ddfe788bb1e8559cd1c58cbf",
            "google_doc_revision": "ANLCKQlFpoKqBapLYb1x_tQMU9zBlXTjYPBgNdYVta5FMRigv81886vGziPze47521ttQnrA-muYT62IiOLalWicrl9nUeYM6KijUjhDyzA",
            "verification_note": "Verified English manuscript coverage through physical source page 70 in the linked Google Doc. Pages 61-70 complete Ibn Taymiyyah\u0027s stated position on visitation, summarize six consequences of that position, begin the response to his claims, present Sunni and Ahl al-Bayt visitation narrations, and open the evidence from scholars before and after Ibn Taymiyyah. All 33 source notes from pages 61-70 are native Google Docs footnotes; the manuscript now contains 126 native footnotes total. No readable Arabic-script manuscript prose remains in the newly translated batch. Translation remains in progress; continue sequentially from physical source page 71."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/5/progress

name: One-shot Book 2 Progress 45

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-progress-35.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 45/375 translation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 45,
            "expected_previous_pages": 40,
            "source_total_pages": 375,
            "source_pdf_sha256": "48d338363f4443d291c4e53365efef6eb36deb87ddfe788bb1e8559cd1c58cbf",
            "google_doc_revision": "ANLCKQl_1PXPhc2ALU9sOWIY5GQMasunD2nNiFUezzPIkMhwBpC2XpMyTxVpqlhraeJ136Z8GzNSgNRjcYiHeJjYcVWxnvcSk-BD_HR96Uo",
            "verification_note": "Verified English coverage through physical source page 45 in the linked Google Doc. Pages 41-42 complete the extended source footnote on transmigration and its rational refutation. Pages 42-45 introduce Qurʾanic and hadith evidence for the Prophet\u0027s barzakhī life, including al-Ṭabrisī, al-Ṭabarī, al-Rāzī, al-Haythamī, Ibn Ḥajar, al-Albānī, al-Kattānī, al-Suyūṭī, Ibn al-Qayyim, and al-Qurṭubī. All 8 source footnotes from this batch are native Google Docs footnotes; the manuscript now has 66 native footnotes total. Zero readable Arabic runs were found in the checked English document text surfaces. Translation remains in progress; continue sequentially from physical page 46."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/5/progress

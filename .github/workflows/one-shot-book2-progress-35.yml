name: One-shot Book 2 Progress 55

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-progress-35.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Publish verified 55/375 translation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "translated_pages": 55,
            "expected_previous_pages": 50,
            "source_total_pages": 375,
            "source_pdf_sha256": "48d338363f4443d291c4e53365efef6eb36deb87ddfe788bb1e8559cd1c58cbf",
            "google_doc_revision": "ANLCKQm-2noJuvwppQG1IV4RQVj-96TQGSuaFCOQ2aRHTvZP5aXjun1kfA5z_LEfATsgIiPMEmIwemmaXoUImeRIm6001Ewt3ehlTarlEso",
            "verification_note": "Verified English coverage through physical source page 55 in the linked Google Doc. Pages 51-54 complete the two views on the Prophet\u0027s connection with worldly life after death, explain the movement of the spirit in barzakhī life, discuss the consequences of the two positions, and close Chapter Two with results/findings. Page 55 is the Chapter Three opener on the legitimacy of visiting the Prophet\u0027s grave. All 6 source footnotes from pages 51-53 are native Google Docs footnotes; the manuscript now has 82 native footnotes total. Zero readable Arabic runs were found in the checked English text surfaces. Translation remains in progress; continue sequentially from physical page 56."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/5/progress

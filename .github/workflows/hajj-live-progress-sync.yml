name: Rites of Hajj verified progress to Workbench

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hajj-live-progress-sync.yml'
      - 'workbench/hajj-progress-sync-trigger.txt'
      - 'workbench/hajj-editorial-status.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 6
    steps:
      - name: Sync verified Google Doc marker for Rites of Hajj
        shell: bash
        run: |
          set -euo pipefail
          base='https://haydari-translation-workbench.pages.dev/api/projects/11'
          curl -fsS --retry 3 "${base}/progress-sync" -o /tmp/hajj-before.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hajj-before.json'))
          assert d.get('marker_found') is True, d
          assert int(d['marker_total']) == 298, d
          assert int(d['marker_pages']) <= 298, d
          print(f"HAJJ_MARKER={d['marker_pages']}/298, STORED={d['project']['translated_pages']}/298")
          PY
          curl -fsS --retry 3 -X POST -H 'x-workbench-actor: Zahraa' "${base}/progress-sync" -o /tmp/hajj-published.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hajj-published.json'))
          if d.get('error'):
            raise SystemExit(d['error'])
          print('HAJJ_POST_COMPLETED')
          PY
          curl -fsS --retry 3 "${base}/progress-sync" -o /tmp/hajj-synced.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hajj-synced.json'))
          assert int(d['project']['translated_pages'])==int(d['marker_pages']),d
          print(f"HAJJ_LIVE_D1_VERIFIED={d['marker_pages']}/{d['marker_total']}")
          PY

      - name: Publish and verify honest current manuscript status
        shell: bash
        run: |
          set -euo pipefail
          base='https://haydari-translation-workbench.pages.dev/api/projects/11'
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hajj-synced.json'))
          pages=int(d['project']['translated_pages'])
          total=int(d['marker_total'])
          assert pages < total, 'Review stage separately if source translation completes'
          with open('workbench/hajj-editorial-status.json',encoding='utf-8') as handle:
            editorial=json.load(handle)
          assert int(editorial['project_id']) == 11
          assert int(editorial['source_total_physical_pages']) == total
          note=(
            f"Rites of Ḥajj — Verified physical source pages: {pages}/{total}. "
            + editorial['draft_coverage'] + " "
            + editorial['verified_editorial_work'] + " "
            + editorial['verified_formatting_work'] + " "
            + editorial['open_gates'] + " "
            + editorial['verification_state']
          )
          if pages < total:
            note += f" Current next source page: {pages+1}."
          previous=(d['project'].get('notes') or '').strip()
          if previous and not previous.startswith(('Translation in progress. Verified physical source pages:', 'Rites of Ḥajj — Verified physical source pages:')):
            note += "\\n\\nOther project notes: " + previous
          json.dump({'notes':note},open('/tmp/hajj-notes.json','w'))
          print('HAJJ_STATUS_NOTE_READY')
          PY
          curl -fsS --retry 3 -X PATCH -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' --data-binary @/tmp/hajj-notes.json \
            "${base}" -o /tmp/hajj-note-response.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hajj-note-response.json'))
          assert not d.get('error'),d
          print('HAJJ_NOTE_PATCH_ACCEPTED')
          PY
          curl -fsS --retry 3 "${base}/progress-sync" -o /tmp/hajj-final.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hajj-final.json'))
          p=int(d['project']['translated_pages'])
          assert p==int(d['marker_pages']),d
          assert f'Verified physical source pages: {p}/298' in (d['project'].get('notes') or ''),d
          print(f'HAJJ_WORKBENCH_UPDATE_CONFIRMED={p}/298')
          PY

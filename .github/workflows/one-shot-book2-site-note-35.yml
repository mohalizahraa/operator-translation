name: One-shot Book 2 Site Note 40

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-site-note-35.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Update live Workbench note for 40/375
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "status": "in_progress",
            "notes": "Translation active. Verified source-page checkpoint: 40/375 as of 2026-10-06. Pages 1-40 are written in the linked English Google Doc. Physical pages 36 and 38 are intentionally blank; page 37 is the Chapter Two opener; pages 39-40 begin the barzakhī-life discussion. Both source footnotes in this batch are native Google Docs notes, including the full continued note on transmigration; the manuscript now contains 58 native footnotes. Continue sequentially from physical source page 41 and publish the next verified checkpoint as it lands."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/5

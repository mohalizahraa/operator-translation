name: One-shot Book 2 Site Note 45

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-site-note-35.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Update live Workbench note for 45/375
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "status": "in_progress",
            "notes": "Translation active. Verified source-page checkpoint: 45/375 as of 2026-10-06. Pages 1-45 are written in the linked English Google Doc. Pages 41-42 finish the extended source note on transmigration; pages 42-45 introduce Qurʾanic and hadith evidence for the Prophet\u0027s barzakhī life. The manuscript now contains 66 native Google Docs footnotes, with all 8 source footnotes from pages 42-45 implemented natively. Continue sequentially from physical source page 46 and publish the next verified checkpoint as it lands."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/5

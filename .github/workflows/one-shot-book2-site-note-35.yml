name: One-shot Book 2 Site Note 70

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-site-note-35.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Update live Workbench note for 70/375
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "status": "in_progress",
            "notes": "Translation active. Verified physical source-page checkpoint: 70/375. Pages 61-70 complete Ibn Taymiyyah\u0027s stated position on visitation, summarize the resulting points, begin the response to his claims, present Sunni and Ahl al-Bayt visitation narrations, and begin the evidence from Muslim scholars before and after Ibn Taymiyyah. The linked English Google Doc now contains 126 native footnotes, including all 33 source notes from pages 61-70. Continue sequentially from physical source page 71."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/5

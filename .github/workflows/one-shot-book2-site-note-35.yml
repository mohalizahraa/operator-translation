name: One-shot Book 2 Site Note 50

on:
  push:
    paths:
      - '.github/workflows/one-shot-book2-site-note-35.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Update live Workbench note for 50/375
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'JSON'
          {
            "status": "in_progress",
            "notes": "Translation active. Verified source-page checkpoint: 50/375 as of 2026-10-06. Pages 1-50 are written in the linked English Google Doc. Pages 46-49 continue the barzakhī-life evidence and philosophical discussion of death, then open the second issue on the Prophet\u0027s connection with the world after death. Page 50 presents the first, severance view associated with Ibn Taymiyyah and Ibn Bāz; its final sentence continues onto page 51. The manuscript now contains 76 native Google Docs footnotes, with all 10 source footnotes from pages 46-50 implemented natively. Continue sequentially from physical source page 51 and publish the next verified checkpoint as it lands."
          }
          JSON
          )
          curl -fsS -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$body" \
            https://haydari-translation-workbench.pages.dev/api/projects/5

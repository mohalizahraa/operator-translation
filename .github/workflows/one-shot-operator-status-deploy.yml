name: One-shot Operator Status Cloudflare probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-operator-status-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '079a6a0664b4ec961a2f003d0d21e797' }}
    steps:
      - name: Verify production Operator Status account access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@latest pages project list | grep -q 'operator-status'
          echo "Translation runner can access operator-status."

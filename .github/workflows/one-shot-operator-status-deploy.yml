name: One-shot Cloudflare secret probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-operator-status-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm Cloudflare deployment secret availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is unavailable in operator-translation." >&2
            exit 2
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare API token is available."
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare account ID is also available."
          else
            echo "Cloudflare account ID secret is absent; canonical account ID can be supplied explicitly."
          fi

name: Google Docs sharing — local zero-cost capability probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-google-sharing-capability-probe-20261020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Report only presence of authorized local automation capabilities
        shell: bash
        run: |
          set -euo pipefail
          printf 'RUNNER_CONFIRMED=%s\n' "$RUNNER_NAME"
          for tool in rclone gcloud osascript safaridriver shortcuts python3 node curl; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%s_PRESENT=true\n' "$tool"
            else
              printf '%s_PRESENT=false\n' "$tool"
            fi
          done
          for candidate in \
            "$HOME/.config/rclone/rclone.conf" \
            "$HOME/.config/gcloud/application_default_credentials.json" \
            "$HOME/.config/gcloud/credentials.db" \
            "$HOME/.credentials/google-drive-token.json" \
            "$HOME/.credentials/token.json" \
            "$HOME/.oauth/google-drive.json"; do
            if [ -f "$candidate" ]; then
              case "$candidate" in
                *rclone*) printf 'RCLONE_CONFIG_PRESENT=true\n';;
                *application_default*) printf 'GCLOUD_ADC_PRESENT=true\n';;
                *credentials.db*) printf 'GCLOUD_USER_AUTH_PRESENT=true\n';;
                *) printf 'LOCAL_GOOGLE_TOKEN_CONFIG_PRESENT=true\n';;
              esac
            fi
          done
          if [ -d "$HOME/Library/Safari" ]; then
            printf 'SAFARI_PROFILE_DIR_PRESENT=true\n'
          fi
          if [ -d "$HOME/Library/Application Support/Google/Chrome" ]; then
            printf 'CHROME_PROFILE_DIR_PRESENT=true_NOT_USED\n'
          fi
          if command -v rclone >/dev/null 2>&1; then
            if rclone listremotes 2>/dev/null | grep -Eiq '(google|drive|gdrive)'; then
              printf 'RCLONE_NAMED_GOOGLE_REMOTE_PRESENT=true\n'
            fi
          fi
          # No content or secret reads; capability booleans only.

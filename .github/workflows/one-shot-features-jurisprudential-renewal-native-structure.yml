name: One-shot Features of Jurisprudential Renewal TOC Refresh

on:
  push:
    paths:
      - '.github/workflows/one-shot-features-jurisprudential-renewal-native-structure.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOC_URL: https://docs.google.com/document/d/1fOo0Y8M1UcaKHR-odP87jGRRlCAT3x9i6AVX7qi6lB0/edit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/operator-playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral browser driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Refresh native Google Docs TOC after final pagination
        shell: bash
        run: |
          cat > ./refresh-toc.mjs <<'NODE'
          import { chromium } from "playwright";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:"en-US"});
          const page=await context.newPage();

          async function focusEditor(){
            for(const loc of [page.locator(".kix-appview-editor").first(),page.locator(".kix-page-paginated").first(),page.locator('[role="textbox"]').first()]){
              if(await loc.isVisible({timeout:1600}).catch(()=>false)){await loc.click({position:{x:520,y:220},force:true}).catch(()=>{});return;}
            }
            await page.mouse.click(800,450);
          }
          async function findAndSettle(query,settle=1800){
            await focusEditor();
            await page.keyboard.press("Meta+f");
            await sleep(300);
            await page.keyboard.type(query,{delay:18});
            await sleep(900);
            const close=page.getByLabel("Close",{exact:true}).first();
            if(await close.isVisible({timeout:1200}).catch(()=>false)) await close.click({force:true});
            else await page.keyboard.press("Escape");
            await sleep(settle);
          }
          async function clickRefresh(){
            const shell=page.getByLabel("Table of contents",{exact:true}).last();
            if(await shell.count().catch(()=>0)){
              try{
                await shell.scrollIntoViewIfNeeded().catch(()=>{});
                await shell.click({force:true});
                await sleep(600);
                const exact=page.getByLabel("Update table of contents",{exact:true}).last();
                if(await exact.isVisible({timeout:1500}).catch(()=>false)){
                  await exact.click({force:true});
                  console.log("NATIVE_TOC_REFRESH_COMPLETED");
                  return true;
                }
              }catch{}
            }
            const candidates=[
              page.getByLabel(/(?:Refresh|Update) table of contents/i).last(),
              page.locator('[aria-label*="Refresh" i][aria-label*="table" i]').last(),
              page.locator('[aria-label*="Update" i][aria-label*="table" i]').last(),
              page.locator('[data-tooltip*="Refresh" i][data-tooltip*="table" i]').last(),
              page.locator('[data-tooltip*="Update" i][data-tooltip*="table" i]').last()
            ];
            for(const loc of candidates){
              if(await loc.isVisible({timeout:600}).catch(()=>false)){await loc.click({force:true});console.log("NATIVE_TOC_REFRESH_COMPLETED_FALLBACK");return true;}
            }
            return false;
          }

          try{
            await page.goto(process.env.DOC_URL,{waitUntil:"domcontentloaded",timeout:120000});
            await sleep(10000);
            if(/accounts\.google\.com/.test(page.url())) throw new Error("Document requires sign-in");
            const anchors=[
              "Islamic Jurisprudence and the Necessity of Ijtihād",
              "Causes of the Problem in Contemporary Islamic Jurisprudence",
              "Jurisprudential Theories in the Imāmī School",
              "Imam Khomeini and the Theory of Time and Place",
              "Indexes",
              "Index of References and Sources"
            ];
            for(const anchor of anchors){console.log("PAGINATE_ANCHOR="+anchor);await findAndSettle(anchor,1700);}
            await findAndSettle("Contents",1800);

            const tocLink=page.getByRole('link',{name:/^Islamic Jurisprudence and the Necessity of Ijtihād/i}).first();
            if(await tocLink.isVisible({timeout:1200}).catch(()=>false)){
              await tocLink.click({force:true}).catch(()=>{});
              await sleep(600);
              if(await clickRefresh()){await sleep(9000);process.exit(0);}
            }
            for(const key of ["ArrowDown","ArrowDown","ArrowRight","End"]){
              await page.keyboard.press(key).catch(()=>{});
              await sleep(350);
              if(await clickRefresh()){await sleep(9000);process.exit(0);}
            }
            const pages=page.locator(".kix-page-paginated:visible");
            const count=await pages.count();
            for(let i=0;i<count;i++){
              const b=await pages.nth(i).boundingBox().catch(()=>null);
              if(!b) continue;
              for(const [xr,yr] of [[0.25,0.18],[0.5,0.18],[0.75,0.18],[0.25,0.3],[0.5,0.3],[0.75,0.3],[0.5,0.5]]){
                await page.mouse.click(b.x+b.width*xr,b.y+b.height*yr);
                await sleep(300);
                if(await clickRefresh()){await sleep(9000);process.exit(0);}
              }
            }
            throw new Error("Native TOC refresh control not found");
          } finally { await browser.close(); }
          NODE
          node ./refresh-toc.mjs
      - name: Remove ephemeral browser payload
        if: always()
        run: |
          rm -f ./refresh-toc.mjs
          rm -rf /tmp/operator-playwright-browsers
          rm -rf node_modules/playwright node_modules/playwright-core node_modules/.bin/playwright


# terminal-refresh-trigger-3

name: Workbench one-shot manifest live readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-workbench-manifest-readback-20261020.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    runs-on: [self-hosted, operator-translation, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Fetch only live public Workbench metadata
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsSL --max-time 40 --connect-timeout 10             https://haydari-translation-workbench.pages.dev/api/projects -o "$tmp"
          python3 - "$tmp" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))['projects']
          print("LIVE_TOTAL=",len(rows))
          print("LIVE_ENGLISH_LINKED=",sum(bool(r.get('google_doc_url')) for r in rows))
          started=[r for r in rows if r.get('status')!='not_started']
          print("LIVE_STARTED=",len(started))
          print("LIVE_QUESTIONS_LINKED=",sum(bool(r.get('questions_doc_url')) for r in started))
          p=next(x for x in rows if x['id']==12)
          print("BOOK12_ENGLISH_LINKED=",bool(p.get('google_doc_url')))
          print("BOOK12_QUESTIONS_LINKED=",bool(p.get('questions_doc_url')))
          print("BOOK12_TRANSLATED_PAGES=",p.get('translated_pages'))
          PY
